{
  "name": "Read-only production v2 failure diagnosis",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "codex/rebuild-production-v2"
      ],
      "paths": [
        ".github/production-v2-diagnose.json"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "jobs": {
    "diagnose": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests"
        },
        {
          "name": "Read retained failure artifacts and masked logs; no provider or post calls",
          "run": "python - <<'PY_DIAG'\nimport json,subprocess,sys\nfrom pathlib import Path\nrequest=json.loads(Path('.github/production-v2-diagnose.json').read_text())\nassert request['read_only'] is True\nsubprocess.run([sys.executable,'-m','production_v2.diagnose','--profile',request['profile'],'--target-run',str(request['target_run'])],check=True)\nPY_DIAG"
        }
      ]
    }
  }
}
