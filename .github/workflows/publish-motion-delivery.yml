name: Publish Verified Motion Delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-motion-delivery.yml']
permissions:
  contents: write
  actions: read
jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: revised-motion-episode
          path: verified-motion
          run-id: 39472874478
          github-token: ${{ github.token }}
      - name: Verify the already rendered full-HD delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("verified-motion");v=json.loads((root/"verification.json").read_text())
          assert v["passed"] and v["decoded_complete"]
          assert (v["width"],v["height"],v["fps"],v["scene_count"])==(1080,1920,30,4)
          assert abs(v["duration_seconds"]-37.28)<.01
          assert hashlib.sha256((root/"motion-episode.mp4").read_bytes()).hexdigest()==v["video_sha256"]
          assert all((root/f"scene-{i}.jpg").is_file() for i in range(4))
          print(json.dumps(v,ensure_ascii=False,indent=2))
          PY
      - name: Save the existing verified file on the current repository base
        env:
          RESULT_BRANCH: codex/motion-delivery-${{ github.run_id }}
        run: |
          git fetch origin main
          git switch -c "$RESULT_BRANCH" origin/main
          target="motion-episodes/39472874478"
          mkdir -p "$target"
          cp verified-motion/* "$target/"
          printf '%s\n' '39472874478 / attempt 2 / generated and decoded on GitHub Actions' > "$target/render-source-run.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save verified full-HD Dunkirk motion episode, actual narration and production evidence"
          git push origin "$RESULT_BRANCH"
