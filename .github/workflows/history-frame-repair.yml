{
  "name": "Recover exact retained history film; render missing quarter only",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/history-frame-repair.json"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "professional-daily-history",
    "cancel-in-progress": false
  },
  "jobs": {
    "recover": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "GITHUB_TOKEN": "${{ github.token }}",
        "GH_RELEASE_TOKEN": "${{ github.token }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "BUFFER_CHANNEL_IDS": "${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}",
        "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}",
        "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}",
        "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN }}",
        "YT_REFRESH_TOKEN_FALLBACK": "${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}",
        "BUFFER_YOUTUBE_CHANNEL_ID": "${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}",
        "BUFFER_FACEBOOK_CHANNEL_ID": "${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}",
        "BUFFER_INSTAGRAM_CHANNEL_ID": "${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}",
        "BUFFER_TIKTOK_CHANNEL_ID": "${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}",
        "HORROR_REVIEW_GENRE": "${{ inputs.horror_genre || '' }}",
        "DURABLE_SUBMISSION_GUARD": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Install exact renderer and finishing dependencies",
          "run": "sudo apt-get update -qq\nsudo apt-get install -y ffmpeg\npython -m pip install numpy Pillow requests beautifulsoup4 google-api-python-client google-auth-oauthlib\ncd professional_motion\nnpm ci\nnpx playwright-core install --with-deps chromium"
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": 41414310988,
            "name": "original-voice-41414310988",
            "path": "professional_motion/delivery/"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": 41414310988,
            "pattern": "frames-*",
            "path": "professional_motion/chunks/",
            "merge-multiple": true
          }
        },
        {
          "name": "Verify exact retained audio and story before any rendering or publishing",
          "run": "python - <<'CHECK'\nimport hashlib,json\nfrom pathlib import Path\nroot=Path('professional_motion/delivery');story=json.loads((root/'story.json').read_text());timing=json.loads((root/'timing.json').read_text())\nfor file,key in [('story.json','story_sha256'),('narration.wav','audio_sha256')]:\n if hashlib.sha256((root/file).read_bytes()).hexdigest()!=timing[key]:raise ValueError('Retained original story/audio changed')\nrows=json.loads(Path('state/professional_topics.json').read_text())['episodes'];row=next(r for r in rows if r['slot']=='daily-2026-11-02')\nif row['story']!=story:raise ValueError('Current episode differs from retained narration; no replacement')\nif row.get('receipts') or row['status'] in ('scheduled','published'):raise ValueError('Publication exists; reconcile, never resubmit')\nCHECK\nnode tests/test_animation_time.mjs"
        },
        {
          "name": "Render only the missing quarter; keep all three retained completed quarters",
          "run": "node professional_motion/render.mjs --style original --part 2 --parts 4 --output-dir professional_motion/chunks --output chunk-2.mp4"
        },
        {
          "name": "Join every original frame without gaps or repetition",
          "run": "python -m professional_motion.merge_chunks"
        },
        {
          "name": "Mix quieter music and verify the actual 90–180 second movie",
          "id": "finish",
          "run": "python -m professional_motion.finish\npython -m professional_motion.cli rendered history --slot \"daily-2026-11-02\""
        },
        {
          "name": "Persist the completed episode and its exact video checksum",
          "if": "steps.finish.outcome == 'success'",
          "run": "python -m professional_motion.persist_state"
        },
        {
          "name": "Schedule approved daily film for exactly 17:00 Cairo",
          "if": "steps.finish.outcome == 'success'",
          "run": "python -m professional_motion.cli publish history --slot \"daily-2026-11-02\" --due \"2026-11-03T15:00:00Z\"",
          "id": "publication"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "history-professional-${{ github.run_id }}",
            "path": "professional_motion/output/\nprofessional_motion/delivery/\nstate/professional_topics.json",
            "retention-days": 30,
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Preserve partial provider acceptance receipts on any failure",
          "if": "always()",
          "run": "python -m professional_motion.persist_state"
        }
      ]
    }
  }
}
