def pick_story_angle(offset: int = 0) -> str:
    return STORY_ANGLES[(date.today().toordinal() + offset) % len(STORY_ANGLES)]


def build_story_prompt(
    recent_titles: list[str], recent_regions: list[str], recent_hooks: list[str],
    target_words: int, angle: str,
) -> str:
    max_words = int(target_words * PROMPT_MAX_FACTOR)
    min_words = int(target_words * 0.85)
    message = (
        "اكتب حلقة جديدة تمامًا: قصة تاريخية موثقة كاملة (خطاف، تمهيد، "
        "تصاعد، ذروة، نتيجة، خاتمة) في رد واحد، وفق تعليمات النظام.\n\n"
        f"⚠️ الزاوية المقترحة لهذا التشغيل: {angle}. التزم بها ما لم تكن "
        "الواقعة المناسبة مكررة أو غير موثقة بما يكفي، فاختر بديلًا قريبًا.\n\n"
        "⚠️ عدم التكرار: ممنوع اختيار واقعة سبق استخدامها حتى بعنوان أو "
        "صياغة مختلفة. الهوكات المذكورة أدناه تصف الوقائع السابقة بدقة؛ "
        "إن كانت الواقعة التي في بالك تصف حادثة أحدها فارفضها.\n\n"
        "⚠️ اللغة: NARRATION بالفصحى المبسطة فقط، بلا عامية، وبلا أرقام "
        "أو رموز أو أقواس أو حروف لاتينية (الأرقام تُكتب بالحروف)، وبلا "
        "تشكيل كامل. راجع مطابقة الضمائر والأفعال والتذكير والتأنيث.\n\n"
        "⚠️ التوثيق: اختر واقعة قابلة للمراجعة من مصدر موثوق، ولا تختلق "
        "حوارًا ولا رقمًا ولا اسمًا ولا نتيجة. إذا اختلفت الروايات فاذكر "
        "ذلك بوضوح.\n\n"
        f"⚠️ الطول: المستهدف حوالي {target_words} كلمة عربية، والمسموح بين "
        f"{min_words} و{max_words} كلمة، والحد الأقصى المطلق {max_words} كلمة "
        "ولا تتجاوزه أبدًا. خطط للقصة مسبقًا بحيث تنتهي بخاتمة حقيقية داخل "
        "هذا الحد، واختصر التفاصيل الجانبية عند الحاجة. القصة المكتملة "
        "المتماسكة أهم من بلوغ رقم بعينه، ولا تحشُ بتفاصيل غير موثقة.\n\n"
        f"{_FORMAT_RULES}{_STORY_FORMAT_BLOCK}"
    )
    if recent_titles:
        message += "\n\nالعناوين السابقة (تجنب أي تشابه معها):\n- " + "\n- ".join(recent_titles)
    if recent_hooks:
        message += "\n\nالهوكات السابقة (ممنوع نفس الواقعة بأي صياغة):\n- " + "\n- ".join(recent_hooks)
    if recent_regions:
        message += "\n\nالعصور والأماكن السابقة (اختر عصرًا مختلفًا):\n- " + "\n- ".join(recent_regions)
    return message


def build_condense_prompt(current: int, target: int) -> str:
    max_words = int(target * PROMPT_MAX_FACTOR)
    return (
        f"القصة طلعت {current} كلمة، وهذا أطول بكثير من المطلوب (المستهدف حوالي "
        f"{target} كلمة والحد الأقصى المطلق {max_words} كلمة). أعد كتابة الحلقة "
        "كاملة مختصرة: احذف التفاصيل الجانبية والتكرار، واحتفظ بالخطاف "
        "والحلقة المفتوحة واللحظة الحاسمة والنتيجة والخاتمة والمصدر نفسه، "
        "من غير إضافة أي معلومة جديدة. اكتب الرد بنفس الصيغة من الأول:\n\n"
        f"{_FORMAT_RULES}{_STORY_FORMAT_BLOCK}"
    )


def build_expand_story_prompt(current: int, target: int) -> str:
    max_words = int(target * PROMPT_MAX_FACTOR)
    return (
        f"القصة قصيرة ({current} كلمة بينما المستهدف حوالي {target}). أعد كتابة "
        "الحلقة كاملة بنفس الواقعة والخطاف والمصدر، مع تفاصيل سياقية ووصفية "
        "إضافية واردة في المصدر نفسه (المكان، الزمان، الأسباب، ردود الأفعال)، "
        f"دون اختراع أي حدث أو تفصيلة، وبحد أقصى {max_words} كلمة. اكتب الرد "
        "بنفس الصيغة من الأول:\n\n"
        f"{_FORMAT_RULES}{_STORY_FORMAT_BLOCK}"
    )


def build_finish_ending_prompt() -> str:
    return (
        "النص اتقطع قبل خاتمة حقيقية. اكتب الآن فقط الجملة أو الجمل الختامية "
        "التي تقفل القصة بعبرة قصيرة مبنية على الواقعة نفسها ثم سؤالًا ختاميًا "
        "يدعو إلى التعليق، دون أي حدث جديد ودون تكرار جملة سابقة ودون ذكر "
        "مصدر. أجب بنص الخاتمة فقط، وآخر حرف حرفيًا فيه نقطة (.) أو علامة "
        "تعجب (!) أو علامة استفهام (؟)، من غير قوس أو علامة اقتباس."
    )


def ensure_complete_ending(client, history, narration: str, system_prompt: str, attempt_label: str) -> str:
    """لو narration متقطوعة، نداء واحد بس لإكمال الخاتمة."""
    if not looks_truncated(narration):
        return narration
    reply, _ = call_model(
        client, history, build_finish_ending_prompt(),
        free_text_config, system_prompt, STORY_MAX_TOKENS,
        f"{attempt_label} | إكمال الخاتمة",
    )
    narration = narration + " " + clean_continuation_text(reply)
    print(f"   📝 بعد إكمال الخاتمة: {count_words(narration)} كلمة")
    return narration


