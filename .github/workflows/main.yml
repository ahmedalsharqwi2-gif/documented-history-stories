name: Create and Publish Historical Strategy Episode

on:
  schedule:
    # يبدأ التوليد الساعة 08:00 UTC، والنشر مساءً بعد 8 ساعات.
    - cron: "0 8 * * *"
  workflow_dispatch:

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: historical-strategy-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Verify faster-whisper is importable on the same interpreter
        run: python -c "import faster_whisper; print('faster-whisper OK:', faster_whisper.__file__)"

      - name: Generate complete historical strategy episode script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # النموذج الأساسي. عند نفاد حصته ينتقل السكربت تلقائيًا للبديل.
          GEMINI_MODEL: "gemini-2.5-flash"
          # مهم: لا تستخدم gemini-3.5-flash-lite؛ Google أعلن أنه غير متاح
          # للمستخدمين الجدد. استخدم النموذج الذي أوصى به رد API.
          GEMINI_FALLBACK_MODELS: "gemini-3.5-flash-lite"
          GEMINI_THINKING_BUDGET: "2048"
          TARGET_WORDS: "1050"
        run: python scripts/generate_script.py

      - name: Fetch landscape stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Prepare SILMA human reference audio
        env:
          SILMA_REFERENCE_AUDIO_B64: ${{ secrets.SILMA_REFERENCE_AUDIO_B64 }}
        run: |
          if [ -z "$SILMA_REFERENCE_AUDIO_B64" ]; then
            echo "Missing SILMA_REFERENCE_AUDIO_B64 GitHub secret."
            echo "Add a base64-encoded, consented human reference OGG/Opus before running production."
            exit 1
          fi
          mkdir -p assets
          printf '%s' "$SILMA_REFERENCE_AUDIO_B64" | base64 --decode > assets/voice_reference_human.ogg
          ffmpeg -y -i assets/voice_reference_human.ogg -ac 1 -ar 24000 -sample_fmt s16 assets/voice_reference_human.wav

      - name: Generate narration with SILMA and subtitles
        env:
          TTS_ENGINE: "silma"
          SILMA_REFERENCE_WAV: "assets/voice_reference_human.wav"
          SILMA_REFERENCE_TEXT: ${{ secrets.SILMA_REFERENCE_TEXT }}
          SILMA_SPEED: "1.0"
        run: python scripts/generate_voice.py

      - name: Assemble full landscape video and platform reel
        run: python scripts/assemble_video.py

      - name: Publish full video and reel together
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_VIDEO_DELAY_HOURS: "8"
          FULL_TO_SHORT_1_HOURS: "8"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      # Buffer لا يدعم فيديوهات YouTube الطويلة؛ يتم نشر الفيديو الكامل
      # مباشرة عبر YouTube Data API.
      - name: Publish full video directly to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FULL_VIDEO_DELAY_HOURS: "8"
        run: python scripts/publish_youtube_direct.py

      - name: Check YouTube token age
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_youtube_token_age.py

      - name: Upload generated media artifacts
        uses: actions/upload-artifact@v5
        with:
          name: historical-strategy-episode-media-${{ github.run_id }}
          path: |
            output/final_video_full.mp4
            output/short_*.mp4
            state/current_episode.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit clip tracking state only
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json state/yt_token_last_success.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في حالة الكليبات"
            exit 0
          fi
          git commit -m "chore: update used clips tracking [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "إعادة محاولة push رقم $attempt"
            sleep $((attempt * 5))
          done
          echo "فشل push بعد 5 محاولات"
          exit 1
