    "أنت مدقق لغوي عربي متخصص في ضبط نصوص النطق. صحح النص المرسل دون حذف "
    "أو إضافة معلومة أو تغيير ترتيب الكلمات. راجع الفاعل والمفعول وعائد كل "
    "ضمير، وطابق الأفعال مع الفاعل في التذكير والتأنيث والإفراد والتثنية "
    "والجمع. أضف التشكيل الكامل، خصوصًا للأفعال والضمائر وأواخر الكلمات "
    "والكلمات التي تحتمل قراءتين. حافظ على علامات الوقف، وأعد JSON فقط "
    "بالمفتاح corrected_narration."
)


def proofread_narration_for_tts(client, narration: str, attempt_label: str) -> str:
    """تدقيق وتشكيل اختياري (PROOFREAD_TASHKEEL=true). بسياق نظيف لتوفير
    التوكنز: مش بنعيد إرسال القصة اللي فاتت."""
    prompt = (
        "راجع النص التالي للنطق العربي. لا تغيّر الكلمات أو المعلومات أو "
        "ترتيبها؛ أصلح التشكيل والنحو فقط. النص:\n\n" + narration
    )
    reply, _ = call_model(
        client, [], prompt, tashkeel_json_config, TASHKEEL_SYSTEM_PROMPT,
        max(PROOFREAD_MAX_TOKENS, count_words(narration) * 8),
        f"{attempt_label} | التدقيق والتشكيل",
    )
    try:
        corrected = str(json.loads(reply).get("corrected_narration", "")).strip()
    except (json.JSONDecodeError, AttributeError) as exc:
        raise AttemptFailed("رد التدقيق النحوي ليس JSON صالحًا") from exc
    original_words = _word_signature(narration)
    corrected_words = _word_signature(corrected)
    if not corrected or len(corrected_words) < max(20, int(len(original_words) * 0.85)):
        raise AttemptFailed("التدقيق النحوي أعاد نصًا فارغًا أو مختصرًا بشدة")
    if corrected_words != original_words:
        print("   ⚠️ التدقيق غيّر بعض صيغ الكلمات؛ اتقبل لأنه حافظ على معظم النص")
    return corrected


# ─────────────────────────── تنفيذ محاولة واحدة ───────────────────────────

def run_single_attempt(
    client, system_prompt: str,
    recent_titles: list[str], recent_regions: list[str], recent_hooks: list[str],
    target_words: int, attempt_label: str, attempt_index: int,
) -> dict:
    history: list[types.Content] = []

    # 1) نداء واحد بيبني الحلقة كاملة.
    reply, finish_reason = call_model(
        client, history,
        build_story_prompt(recent_titles, recent_regions, recent_hooks,
                           target_words, pick_story_angle(attempt_index)),
        free_text_config, system_prompt, STORY_MAX_TOKENS,
        f"{attempt_label} | القصة",
    )
    story = parse_story_reply(reply, attempt_label, "القصة")
    narration = story["narration"]
    words = count_words(narration)
    print(f"   📝 القصة: {words} كلمة (هدف {target_words}) | finish={finish_reason or 'غير معروف'}")

    # 2) طويلة بشكل مبالغ فيه -> نداء اختصار واحد.
    if words > int(target_words * CONDENSE_TRIGGER_FACTOR):
        print(f"   ✂️ القصة {words} كلمة، أطول بكثير من الهدف — نداء اختصار.")
        reply, _ = call_model(
            client, history, build_condense_prompt(words, target_words),
            free_text_config, system_prompt, STORY_MAX_TOKENS,
            f"{attempt_label} | اختصار",
        )
        story = parse_story_reply(reply, attempt_label, "الاختصار", fallback=story)
        narration = story["narration"]
        words = count_words(narration)
        print(f"   📝 بعد الاختصار: {words} كلمة")
        if words > int(target_words * ABSOLUTE_MAX_FACTOR):
            raise AttemptFailed(f"القصة لسه طويلة جدًا بعد الاختصار ({words} كلمة)")

    # 3) خاتمة حقيقية.
    narration = ensure_complete_ending(client, history, narration, system_prompt, attempt_label)
    if looks_truncated(narration):
        raise AttemptFailed("narration لسه متقطوعة بعد محاولة إكمال الخاتمة")

    # 4) قصيرة عن الحد الأدنى -> توسيع (لغاية MAX_EXPANSION_ROUNDS).
    for expansion_round in range(1, MAX_EXPANSION_ROUNDS + 1):
        current = count_words(narration)
        if ACCEPTABLE_MIN_WORDS <= 0 or current >= ACCEPTABLE_MIN_WORDS:
            break
        print(f"   ℹ️ الطول ({current}) أقل من الحد الأدنى ({ACCEPTABLE_MIN_WORDS}) — "
              f"توسيع {expansion_round}/{MAX_EXPANSION_ROUNDS}.")
        reply, _ = call_model(
            client, history, build_expand_story_prompt(current, target_words),
            free_text_config, system_prompt, STORY_MAX_TOKENS,
            f"{attempt_label} | توسيع {expansion_round}",
        )
        story = parse_story_reply(reply, attempt_label, "التوسيع", fallback=story)
        narration = ensure_complete_ending(
            client, history, story["narration"], system_prompt, attempt_label
        )
        print(f"   📝 بعد التوسيع {expansion_round}: {count_words(narration)} كلمة")
        if looks_truncated(narration):
            raise AttemptFailed("narration متقطوعة بعد التوسيع ومحاولة إكمال الخاتمة")

    story["narration"] = narration
    episode = build_episode(story)

    # 5) تدقيق وتشكيل اختياري.
    if PROOFREAD_TASHKEEL:
        episode["narration"] = proofread_narration_for_tts(client, narration, attempt_label)

    final_words = count_words(episode["narration"])
    if final_words < target_words:
        print(f"   ℹ️ الطول ({final_words}) أقل من الهدف ({target_words}) لكنه مقبول.")

    error = validate_episode(episode, recent_hooks)
    if error:
        raise AttemptFailed(error)
    return episode


def generate_episode() -> dict:
    global ACTIVE_PROVIDER, ACTIVE_MODEL
    api_key = os.environ.get("GEMINI_API_KEY", "").strip()
    if not api_key and not OPENROUTER_API_KEY:
        sys.exit("خطأ: أضف GEMINI_API_KEY أو OPENROUTER_API_KEY إلى GitHub Secrets")
    if api_key:
        client = ProviderClient(genai.Client(api_key=api_key))
    else:
        ACTIVE_PROVIDER = "openrouter"
        ACTIVE_MODEL = OPENROUTER_MODEL
        client = ProviderClient(None)

    system_prompt = load_system_prompt()
    recent_titles = load_used_history()
    recent_regions = load_used_regions()
    recent_hooks = load_used_hooks()

    print(
        f"🕌 المزود الأساسي: {ACTIVE_PROVIDER} | Gemini: {MODEL} | "
        f"OpenRouter: {OPENROUTER_MODEL or 'غير مفعّل'} | thinking_budget: {THINKING_BUDGET} | "
        f"هدف الطول: {TARGET_WORDS} كلمة | الحد الأدنى: {ACCEPTABLE_MIN_WORDS or 'غير محدد'} | "
        f"تشكيل: {'نعم' if PROOFREAD_TASHKEEL else 'لا'}"
    )

    last_error = "لم تبدأ أي محاولة"
    quota_errors: list[str] = []
    attempt = 0
    while attempt < MAX_ATTEMPTS:
        attempt += 1
        print(f"\n===== محاولة كاملة {attempt}/{MAX_ATTEMPTS} "
              f"[{ACTIVE_PROVIDER}:{ACTIVE_MODEL}] =====")
        try:
            return run_single_attempt(
                client, system_prompt, recent_titles, recent_regions, recent_hooks,
                TARGET_WORDS, f"محاولة {attempt}", attempt - 1,
            )
        except (QuotaExhausted, ModelUnavailable, ProviderFailover) as exc:
            last_error = str(exc)
            if isinstance(exc, QuotaExhausted):
                quota_errors.append(last_error)
            if switch_to_next_model():
                print(f"⚠️ {exc}\n🔁 انتقلت إلى: {ACTIVE_PROVIDER}:{ACTIVE_MODEL} "
                      "(التحويل لا يستهلك من المحاولات الكاملة).", flush=True)
                attempt -= 1
                continue
            details = "\n".join(f"- {item}" for item in quota_errors)
            sys.exit(
                "❌ توقف: لا يوجد مزوّد أو نموذج آخر متاح.\n"
                f"نماذج Gemini: {MODEL_CANDIDATES} | OpenRouter: {OPENROUTER_MODEL or 'غير مفعّل'}\n"
                f"آخر خطأ: {last_error}\n"
                + (f"تفاصيل الحصة:\n{details}\n" if details else "")
                + "الحل: انتظر تجدد الحصة، أو أضف نموذجًا احتياطيًا متاحًا في "
                "GEMINI_FALLBACK_MODELS، أو افحص اسم النموذج."
            )
        except AttemptFailed as exc:
            last_error = str(exc)
            print(f"⚠️ فشلت المحاولة الكاملة {attempt}/{MAX_ATTEMPTS}: {last_error}")
        except Exception as exc:  # noqa: BLE001 — أي خطأ غير متوقع
            last_error = f"خطأ غير متوقع: {exc}"
            print(f"⚠️ فشلت المحاولة الكاملة {attempt}/{MAX_ATTEMPTS}: {last_error}")

    sys.exit(f"❌ فشل توليد حلقة سليمة بعد {MAX_ATTEMPTS} محاولات كاملة. آخر خطأ: {last_error}")


if __name__ == "__main__":
    episode = generate_episode()
    OUTPUT_PATH.parent.mkdir(parents=True, exist_ok=True)
    OUTPUT_PATH.write_text(json.dumps(episode, ensure_ascii=False, indent=2), encoding="utf-8")
    print(f"✅ اتكتبت الحلقة: {episode['title']}")
    print(f"   العصر/المكان: {episode.get('region', 'غير محدد')}")
    print(f"   عدد كلمات narration: {count_words(episode.get('narration', ''))}")
    print(f"   الهوك: {episode.get('hook', '')[:80]}")
    print(f"   المصدر: {episode.get('source_type', '')} — {episode.get('source_reference', '')}")
    print(f"   كلمات البحث: {episode['visual_keywords']}")
    print(f"   تلميحات النطق: {episode.get('phonetic_hints', [])}")
