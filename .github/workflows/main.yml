name: Create and Publish Documented History Story
run-name: ${{ inputs.stock_date && format('stock {0} {1} Cairo', inputs.stock_date, inputs.stock_hour) || 'Manual video production' }}

on:
  workflow_dispatch:
    inputs:
      voice_profile:
        description: "اختر صوت الراوي لهذا الفيديو"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - mohamed_elbed
          - rafik_sa
          - egyptian_female
          - hossam
          - hossam_uploaded
          - marwan
          - nassim
          - ahmed_z
      stock_date:
        description: 'Cairo date(s): YYYY-MM-DD or 13,14,15-10-2026; each slot gets its own video'
        required: false
        type: string
      stock_hour:
        description: 'Cairo hour(s): 12, 18, or 12,18'
        required: false
        type: string
      dry_run:
        description: "Build and validate without publishing externally"
        required: false
        default: false
        type: boolean
      publish_now:
        description: "انشر فورًا لتعويض موعد فائت"
        required: false
        default: false
        type: boolean
      video_renderer:
        description: "Video renderer (native FFmpeg)"
        required: false
        default: ffmpeg
        type: choice
        options:
          - ffmpeg

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: documented-history-story-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_TEXT_API_KEY: ${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}
  GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
  CINEMATIC_ENABLED: 'true'
  # Free-only production: repository variables cannot unlock paid endpoints.
  CINEMATIC_FREE_ONLY: 'true'
  CINEMATIC_PAID_ENABLED: 'false'
  CINEMATIC_VIDEO_ENABLED: 'false'
  CINEMATIC_EPISODE_BUDGET_USD: '0'
  CINEMATIC_DAILY_BUDGET_USD: '0'
  CINEMATIC_IMAGE_MODEL: ${{ vars.CINEMATIC_IMAGE_MODEL || 'gemini-3.1-flash-lite-image' }}
  CINEMATIC_IMAGE_FALLBACK_MODEL: ${{ vars.CINEMATIC_IMAGE_FALLBACK_MODEL || 'gemini-3.1-flash-image' }}
  QUALITY_GATES_BLOCKING: 'false'
  CLIP_REVIEW_ENABLED: 'false'
  BACKGROUND_MUSIC_ENABLED: 'true'
  # Consecutive production runs cycle 1 -> 2 -> 3; retries keep the same track.
  MUSIC_ROTATION_INDEX: ${{ github.run_number }}
  BACKGROUND_MUSIC_VOLUME: '0.07'
  PYTHONPATH: ${{ github.workspace }}
  HISTORY_SOURCE_GATE_ENABLED: 'false'

jobs:
  plan_slots:
    # Publishing paused by owner request on 2026-10-17.
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.slots.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate and expand Cairo publication inputs
        id: slots
        env:
          STOCK_DATE: ${{ inputs.stock_date || '' }}
          STOCK_HOUR: ${{ inputs.stock_hour || '' }}
        run: python3 scripts/publication_slots.py

  build-and-publish:
    # Publishing paused by owner request on 2026-10-17.
    if: ${{ false }}
    env:
      PUBLICATION_RECEIPTS_ENABLED: 'true'
      PUBLISH_IMMEDIATE: ${{ inputs.publish_now && matrix.date == '' }}
      PRODUCTION_MEDIA_ID: ${{ format('{0}-{1}-{2}', github.run_id, matrix.date, matrix.hour) }}
    needs: plan_slots
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan_slots.outputs.matrix) }}
    # Manual dispatch is authoritative: dry_run=true validates only, while
    # dry_run=false performs the explicitly requested live publication.
    # Scheduled runs publish automatically at the configured Cairo slots.
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Set final Cairo publication slot
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          PUBLISH_NOW: ${{ inputs.publish_now || false }}
          STOCK_DATE: ${{ matrix.date }}
          STOCK_HOUR: ${{ matrix.hour }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          cairo_now = now.astimezone(ZoneInfo("Africa/Cairo"))
          stock_date = os.environ.get("STOCK_DATE", "").strip()
          stock_hour = os.environ.get("STOCK_HOUR", "").strip()
          if stock_date:
              from datetime import date
              day = date.fromisoformat(stock_date)
              if stock_hour not in ("12", "18"):
                  raise SystemExit("Stock hour must be 12 or 18 Cairo")
              if not (cairo_now.date() <= day <= (cairo_now + timedelta(days=4)).date()):
                  raise SystemExit("Stock publication date must be within four days")
              target = datetime.combine(day, datetime.min.time(), ZoneInfo("Africa/Cairo")).replace(hour=int(stock_hour))
              due_at = target.astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
              print(f"Stock publication slot: {due_at} UTC")
              raise SystemExit(0)
          if os.environ.get("PUBLISH_NOW", "false").lower() == "true":
              # Reserve enough time for voice synthesis, montage and upload before Buffer scheduling.
              target = datetime.now(timezone.utc) + timedelta(minutes=90)
              due_at = target.isoformat(timespec="seconds").replace("+00:00", "Z")
              print(f"Immediate catch-up publication slot: {due_at} UTC")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
              raise SystemExit(0)
          target_hour = {"17 6 * * *": 12, "17 12 * * *": 18}.get(os.environ.get("SCHEDULE_EXPR", ""))
          if target_hour is None:
              slots = [cairo_now.replace(hour=12, minute=0, second=0, microsecond=0),
                       cairo_now.replace(hour=18, minute=0, second=0, microsecond=0)]
              target = next((slot for slot in slots if slot > cairo_now), slots[0] + timedelta(days=1))
          else:
              target = cairo_now.replace(hour=target_hour, minute=0, second=0, microsecond=0)
              if target <= cairo_now:
                  # A delayed morning run should still reach today's evening
                  # slot instead of being rolled to tomorrow's noon.
                  slots = [cairo_now.replace(hour=12, minute=0, second=0, microsecond=0),
                           cairo_now.replace(hour=18, minute=0, second=0, microsecond=0)]
                  target = next((slot for slot in slots if slot > cairo_now),
                                slots[0] + timedelta(days=1))
          # Keep scheduled production three days ahead; emergency publish_now is unchanged.
          target += timedelta(days=3)
          due_at = target.astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          print(f"Final Cairo publication slot: {target.isoformat()} ({due_at} UTC)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
          PY

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Load the latest topic/clip history after the preceding job finishes.
          ref: main

      - name: Restore prepared text for this publication slot
        id: prepared_text
        uses: actions/cache/restore@v4
        with:
          path: state/current_episode.json
          key: prepared-v1-${{ github.repository_id }}-${{ inputs.dry_run || false }}-${{ matrix.date || github.run_id }}-${{ matrix.hour }}

      - name: Validate restored text against current topic history
        id: checked_text
        run: python scripts/check_prepared_text.py --path state/current_episode.json --history state/topic_history.json

      - name: Restore inspected cinematic scenes
        if: ${{ env.CINEMATIC_ENABLED == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .cinematic_cache
          key: cinematic-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.date }}-${{ matrix.hour }}
          restore-keys: cinematic-v1-${{ github.repository_id }}-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install ffmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Select reviewed unused reserve text
        id: reserve_text
        if: steps.checked_text.outputs.usable != 'true'
        env:
          HISTORY_SOURCE_GATE_ENABLED: "false"
          ACCEPTABLE_MIN_WORDS: "180"
          MAX_NARRATION_WORDS: "300"
        run: python scripts/select_prepared_history.py

      - name: Validate and resolve AI model policy
        if: steps.checked_text.outputs.usable != 'true' && steps.reserve_text.outputs.usable != 'true'
        env:
          GEMINI_MODEL: "gemini-flash-lite-latest"
          GEMINI_MODELS: "gemini-flash-lite-latest,gemma-4-26b-a4b-it,gemini-flash-latest"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          # The catalog endpoint can be forbidden while chat completion still
          # works. Keep an ordered, replaceable list so one exhausted model
          # cannot take down the whole production run.
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS || 'openai/gpt-oss-120b,openai/gpt-oss-20b,llama-3.3-70b-versatile' }}
          OPENROUTER_API_KEY: ''
          MODEL_POLICY_FILE: config/model_policy.json
        run: python scripts/model_preflight.py

      - name: Generate complete documented history story script
        if: steps.checked_text.outputs.usable != 'true' && steps.reserve_text.outputs.usable != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          # Keep the validated primary provider available to generation.
          # Runtime quota failures use the bounded fallback chain.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GPT-OSS reasoning tokens share the same output budget. With the
          # constrained 1300-token request, enabling reasoning leaves only a
          # tiny partial answer and breaks the required story fields.
          LLM_SEND_REASONING_EFFORT: "false"
          LLM_FALLBACK_REASONING_EFFORT: "low"
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          # Do not pin a single fallback model here. model_preflight.py writes
          # the currently available model list to GITHUB_ENV; pinning an
          # exhausted model bypasses discovery and defeats the fallback chain.
          LLM_FALLBACK_MAX_TOKENS: "6000"
          ENDING_MAX_TOKENS: "320"
          EXPANSION_MAX_TOKENS: "8000"
          # Gemini هو النموذج الأساسي، وOpenRouter خطة احتياطية مستقلة.
          # 2.5 access is restricted for new users; use current stable models.
          OPENROUTER_API_KEY: ''
          OPENROUTER_TIMEOUT: "45"
          OPENROUTER_MAX_TOKENS: "2200"
          GEMINI_THINKING_BUDGET: "0"
          STORY_MAX_TOKENS: "8000"
          FINALIZE_MAX_TOKENS: "4000"
          TARGET_WORDS: "250"
          MAX_NARRATION_WORDS: "300"
          ACCEPTABLE_MIN_WORDS: "180"
          OPENROUTER_MIN_WORDS: "180"
          # Keep the recovery path enabled: fallback models can return a
          # short narration without terminal punctuation even when the
          # content is otherwise usable. The generator then requests a
          # source-bounded ending before the historical gates run.
          MAX_FULL_ATTEMPTS: "2"
          MAX_EXPANSION_ROUNDS: "3"
          SINGLE_PASS_GENERATION: "false"
          TRANSIENT_RETRIES: "2"
          TRANSIENT_BACKOFF_BASE: "8"
          BUDGET_RETRIES: "1"
          PROOFREAD_TASHKEEL: "false"
          TOPIC_BANK_REQUIRED: "true"
          TOPIC_SELECTION_MODE: "bank"
          TOPIC_ROTATION_SEED: ${{ github.run_id }}
          TOPIC_PERFORMANCE_FILE: "state/topic_performance.json"
        run: |
          echo "Validated primary Gemini model: ${GEMINI_MODEL:-not-configured}"
          python scripts/generate_script.py

      - name: Arabic preflight gates (documented history)
        env:
          TTS_ENGINE: "gemini"
        run: |
          test -f state/current_episode.json || { echo "TEXT_GATE: episode artifact missing"; exit 1; }
          TEXT=$(python -c "import json; print(json.load(open('state/current_episode.json', encoding='utf-8')).get('narration',''))")
          python -m arabic_speech_core.cli preflight --text "$TEXT" --engine gemini --locale ar-EG --voice Charon --no-smoke --lexicon config/arabic_pronunciation.json --min-words 20 --max-words 1200

      - name: History editorial scope gate (sources optional)
        run: python scripts/source_integrity_gate.py --episode state/current_episode.json

      - name: Historical channel scope and religious exclusions
        run: python scripts/historical_verification_gate.py --episode state/current_episode.json

      - name: Save prepared text independently of later media failures
        if: steps.checked_text.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: state/current_episode.json
          key: prepared-v1-${{ github.repository_id }}-${{ inputs.dry_run || false }}-${{ matrix.date || github.run_id }}-${{ matrix.hour }}

      - name: Validate the approved Gemini Charon voice
        run: bash voice_provider/install.sh

      - name: Generate narration with approved Gemini Charon
        env:
          TTS_ENGINE: "gemini"
          WHISPER_MODEL: "small"
          # Whisper occasionally under-recognizes long Arabic SILMA output;
          # Edge's synthesized Arabic can be valid while Whisper misses
          # diacritics and word boundaries; empty/unalignable audio remains fatal.
          ASR_MIN_MATCH_RATIO: "0.55"
          # Mantoq يتطلب numpy>=2 بينما silma-tts يتطلب numpy<=1.26؛
          # نستخدم القاموس والتشكيل المحلي داخل بيئة SILMA، ونجعل Mantoq
          # اختياريًا فقط في بيئة منفصلة حتى لا يفشل تثبيت كل التشغيل.
          MANTOQ_REQUIRED: "false"
        run: python scripts/generate_voice.py

      - name: Assemble one complete vertical video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/assemble_video.py

      - name: Verify final montage and B-roll output
        run: |
          test -s output/final_video_full.mp4 || { echo "ERROR: full montage missing or empty"; exit 1; }
          test -s state/fetched_clips.json || { echo "ERROR: B-roll tracking manifest missing"; exit 1; }
          test "$(python -c 'import json; print(len(json.load(open("state/fetched_clips.json"))))')" -ge 1 || { echo "ERROR: no usable visual assets"; exit 1; }
          dimensions=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final_video_full.mp4)
          test "$dimensions" = "1080,1920" || { echo "ERROR: horizontal output is forbidden; expected 1080x1920, got $dimensions"; exit 1; }
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final_video_full.mp4)
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 0 < duration <= 180.0:
              raise SystemExit(f"ERROR: history video must be no longer than 180 seconds, got {duration:.2f}s")
          print(f"Vertical history montage verified: {duration:.2f}s")
          PY

      - name: Reserve unique topic before external publication
        if: ${{ !inputs.dry_run }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py reserve --file state/topic_history.json --episode state/current_episode.json

      - name: Publish the complete video only
        id: publish_buffer
        continue-on-error: true
        if: ${{ !inputs.dry_run }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_VIDEO_DELAY_HOURS: "8"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      # Buffer لا يدعم فيديوهات YouTube الطويلة؛ يتم نشر الفيديو الكامل
      # مباشرة عبر YouTube Data API.
      - name: Publish full video directly to YouTube
        id: publish_youtube
        continue-on-error: true
        if: ${{ !inputs.dry_run }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
          FULL_VIDEO_DELAY_HOURS: "8"
        run: python scripts/publish_youtube_direct.py

      - name: Confirm actual publication receipts
        if: ${{ !inputs.dry_run }}
        env:
          BUFFER_OUTCOME: ${{ steps.publish_buffer.outcome }}
          YOUTUBE_OUTCOME: ${{ steps.publish_youtube.outcome }}
        run: python scripts/publication_state.py confirm

      - name: Mark topic as published in repository history
        if: ${{ !inputs.dry_run }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py mark-published --file state/topic_history.json --episode state/current_episode.json

      - name: Check YouTube token age
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_youtube_token_age.py

      - name: Upload generated media artifacts
        if: ${{ always() && hashFiles('output/final_video_full.mp4') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: historical-strategy-episode-media-${{ github.run_id }}-${{ matrix.date }}-${{ matrix.hour }}
          path: |
            output/final_video_full.mp4
            state/current_episode.json
            state/audio_matching_report.json
          retention-days: 14
          if-no-files-found: error

      - name: Preserve clip review candidates
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: clip-review-candidates-${{ matrix.date }}-${{ matrix.hour }}
          path: |
            state/clip_review_requests.json
            state/clip_reviews.json
            downloaded_clips/clip_*.mp4
            output/pexels_clips/raw_*
          if-no-files-found: ignore
          retention-days: 3

      - name: Save inspected cinematic scenes even after a failed run
        if: ${{ always() && env.CINEMATIC_ENABLED == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cinematic_cache
          key: cinematic-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.date }}-${{ matrix.hour }}

      - name: Persist confirmed stock and production counters
        if: always()
        run: |
          git config user.name 'content-bot'
          git config user.email 'bot@users.noreply.github.com'
          for path in state/publication_stock.json state/cinematic_budget.json state/yt_token_last_success.json state/used_clips.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist publication receipts and counters [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Preserve cinematic storyboard and quality evidence
        if: ${{ always() && env.CINEMATIC_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.date }}-${{ matrix.hour }}
          path: |
            state/cinematic_storyboard.json
            state/cinematic_scene_manifest.json
            state/cinematic_quality_report.json
            state/cinematic_failures.json
            state/cinematic_budget.json
            state/publication_stock.json
          if-no-files-found: ignore
          retention-days: 14

