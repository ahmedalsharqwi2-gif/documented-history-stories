name: Create and Publish Historical Strategy Episode

on:
  schedule:
    # يبدأ التوليد مرتين يوميًا قبل موعدي النشر 12:00 و18:00 القاهرة.
    # GitHub Actions يستخدم UTC: 06:00 و12:00 UTC في توقيت القاهرة الحالي.
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      voice_profile:
        description: "اختر صوت الراوي لهذا الفيديو"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - mohamed_elbed
          - rafik_sa
          - egyptian_female
          - hossam
          - hossam_uploaded
          - marwan
          - nassim
          - ahmed_z
      dry_run:
        description: "Build and validate without publishing externally"
        required: false
        default: false
        type: boolean
      video_renderer:
        description: "Video renderer (native FFmpeg)"
        required: false
        default: ffmpeg
        type: choice
        options:
          - ffmpeg

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: historical-strategy-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Verify Edge TTS installation
        run: python -c "import edge_tts; print('edge-tts import OK:', getattr(edge_tts, '__version__', 'installed'))"

      - name: Verify faster-whisper is importable on the same interpreter
        run: python -c "import faster_whisper; print('faster-whisper OK:', faster_whisper.__file__)"

      - name: Verify Arabic narration guard
        run: python -m unittest tests.test_arabic_guard -v

      - name: Resolve available fallback model
        env:
          FALLBACK_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
        run: |
          if [ -z "$FALLBACK_KEY" ]; then
            echo "No OpenAI-compatible fallback key; keeping OpenRouter as last resort."
            exit 0
          fi
          MODELS_URL="${FALLBACK_ENDPOINT%/chat/completions}/models"
          if ! curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $FALLBACK_KEY" "$MODELS_URL" > /tmp/fallback_models.json; then
            echo "WARNING: fallback model discovery failed; using the bounded default model."
            exit 0
          fi
          SELECTED_MODEL="$(python - <<'PY'
          import json
          from pathlib import Path
          preferred = (
              "llama-3.1-8b-instant",
              "openai/gpt-oss-20b",
              "llama-3.3-70b-versatile",
              "openai/gpt-oss-120b",
          )
          data = json.loads(Path("/tmp/fallback_models.json").read_text())
          ids = [str(item.get("id")) for item in data.get("data", []) if item.get("id")]
          print(next((name for name in preferred if name in ids), ids[0] if ids else ""))
          PY
          )"
          if [ -z "$SELECTED_MODEL" ]; then
            echo "WARNING: fallback endpoint returned no usable models; using the bounded default model."
            exit 0
          fi
          echo "Resolved fallback model: $SELECTED_MODEL"
          echo "RESOLVED_FALLBACK_MODEL=$SELECTED_MODEL" >> "$GITHUB_ENV"

      - name: Generate complete historical strategy episode script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          LLM_FALLBACK_MAX_TOKENS: "2200"
          # Gemini هو النموذج الأساسي، وOpenRouter خطة احتياطية مستقلة.
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_FALLBACK_MODELS: "gemini-3.5-flash-lite"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "google/gemini-2.5-flash,qwen/qwen3-32b"
          OPENROUTER_TIMEOUT: "45"
          OPENROUTER_MAX_TOKENS: "2200"
          GEMINI_THINKING_BUDGET: "0"
          TARGET_WORDS: "650"
          ACCEPTABLE_MIN_WORDS: "180"
          OPENROUTER_MIN_WORDS: "180"
          MAX_FULL_ATTEMPTS: "1"
          MAX_EXPANSION_ROUNDS: "0"
          SINGLE_PASS_GENERATION: "true"
          TRANSIENT_RETRIES: "5"
          TRANSIENT_BACKOFF_BASE: "8"
          BUDGET_RETRIES: "0"
          PROOFREAD_TASHKEEL: "false"
        run: |
          export LLM_FALLBACK_MODEL="${RESOLVED_FALLBACK_MODEL:-llama-3.1-8b-instant}"
          echo "Using fallback model: $LLM_FALLBACK_MODEL"
          python scripts/generate_script.py

      - name: Arabic preflight gates (history)
        env:
          EDGE_TTS_VOICE: "ar-SA-HamedNeural"
          TTS_ENGINE: "edge"
        run: |
          test -f state/current_episode.json || { echo "TEXT_GATE: episode artifact missing"; exit 1; }
          TEXT=$(python -c "import json; print(json.load(open('state/current_episode.json', encoding='utf-8')).get('narration',''))")
          python -m arabic_speech_core.cli preflight --text "$TEXT" --engine edge --locale ar-SA --voice "$EDGE_TTS_VOICE" --lexicon config/arabic_pronunciation.json --min-words 20 --max-words 1200

      - name: Fetch landscape stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate narration with the selected SILMA reference voice
        env:
          TTS_ENGINE: "edge"
          EDGE_TTS_VOICES: "ar-SA-HamedNeural"
          EDGE_TTS_VOICE: "ar-SA-HamedNeural"
          SILMA_REFERENCE_PROFILE: ${{ github.event.inputs.voice_profile || 'auto' }}
          SILMA_VOICE_PROFILES_FILE: "assets/voices/voice_profiles.json"
          SILMA_SPEED: "1.00"
          SILMA_GUARD_ENABLED: "true"
          SILMA_GUARD_MIN_MATCH_WORDS: "4"
          SILMA_FALLBACK_TO_EDGE: "true"
          WHISPER_MODEL: "base"
          # Whisper occasionally under-recognizes long Arabic SILMA output;
          # Edge's synthesized Arabic can be valid while Whisper misses
          # diacritics and word boundaries; empty/unalignable audio remains fatal.
          ASR_MIN_MATCH_RATIO: "0.55"
          # Mantoq يتطلب numpy>=2 بينما silma-tts يتطلب numpy<=1.26؛
          # نستخدم القاموس والتشكيل المحلي داخل بيئة SILMA، ونجعل Mantoq
          # اختياريًا فقط في بيئة منفصلة حتى لا يفشل تثبيت كل التشغيل.
          MANTOQ_REQUIRED: "false"
          EDGE_TTS_RATE: "-4%"
          EDGE_TTS_PITCH: "-2Hz"
        run: python scripts/generate_voice.py

      - name: Assemble full landscape video and platform reel
        run: python scripts/assemble_video.py

      - name: Verify final montage and B-roll output
        run: |
          test -s output/final_video_full.mp4 || { echo "ERROR: full montage missing or empty"; exit 1; }
          test -s state/fetched_clips.json || { echo "ERROR: B-roll tracking manifest missing"; exit 1; }
          test "$(python -c 'import json; print(len(json.load(open("state/fetched_clips.json"))))')" -ge 4 || { echo "ERROR: fewer than 4 B-roll clips"; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final_video_full.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/final_video_full.mp4
          echo "Professional landscape montage with topic-specific B-roll verified."

      - name: Run B-roll quality gate before Buffer
        run: |
          python scripts/broll_quality_pipeline.py \
            --video output/final_video_full.mp4 \
            --manifest state/fetched_clips.json \
            --expected landscape \
            --min-clips 4

      - name: Reserve unique topic before external publication
        if: ${{ !inputs.dry_run }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py reserve --file state/topic_history.json --episode state/current_episode.json

      - name: Publish full video and reel together
        if: ${{ !inputs.dry_run }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_VIDEO_DELAY_HOURS: "8"
          FULL_TO_SHORT_1_HOURS: "8"
          PUBLISH_HOURS_CAIRO: "12,18"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      # Buffer لا يدعم فيديوهات YouTube الطويلة؛ يتم نشر الفيديو الكامل
      # مباشرة عبر YouTube Data API.
      - name: Publish full video directly to YouTube
        if: ${{ !inputs.dry_run }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
          FULL_VIDEO_DELAY_HOURS: "8"
          PUBLISH_HOURS_CAIRO: "12,18"
        run: python scripts/publish_youtube_direct.py

      - name: Mark topic as published in repository history
        if: ${{ !inputs.dry_run }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py mark-published --file state/topic_history.json --episode state/current_episode.json

      - name: Check YouTube token age
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_youtube_token_age.py

      - name: Upload generated media artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: historical-strategy-episode-media-${{ github.run_id }}
          path: |
            output/final_video_full.mp4
            output/short_*.mp4
            state/current_episode.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit clip tracking state only
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json state/yt_token_last_success.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في حالة الكليبات"
            exit 0
          fi
          git commit -m "chore: update used clips tracking [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "إعادة محاولة push رقم $attempt"
            sleep $((attempt * 5))
          done
          echo "فشل push بعد 5 محاولات"
          exit 1
