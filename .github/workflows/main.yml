    return _load_history_field("hook", limit)


def count_words(text: str) -> int:
    return len(text.split())


_SENTENCE_ENDERS = (".", "!", "؟", "?", "…")
_TRAILING_WRAPPERS = ")\"'”’»」』﴾]"
_TRAILING_PAREN_GROUP = re.compile(r"[\(（][^()（）]*[\)）]\s*$")


def looks_truncated(narration: str) -> bool:
    """النص متقطوع لو آخره (بعد تجاهل استشهاد بين قوسين وأقواس ختامية)
    مش علامة نهاية جملة حقيقية."""
    stripped = narration.strip()
    if not stripped:
        return True
    match = _TRAILING_PAREN_GROUP.search(stripped)
    if match:
        without_paren = stripped[: match.start()].rstrip()
        if without_paren:
            stripped = without_paren
    trimmed = stripped.rstrip(_TRAILING_WRAPPERS)
    if not trimmed:
        return True
    return not trimmed.endswith(_SENTENCE_ENDERS)


def split_arabic_sentences(narration: str) -> list[str]:
    """نفس منطق split_sentences() في generate_voice.py."""
    parts = re.split(r"(?<=[.!؟…])\s+", narration.strip())
    return [part.strip() for part in parts if part.strip()]


def _word_signature(text: str) -> list[str]:
    plain = re.sub(r"[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]", "", text)
    return re.findall(r"[\u0621-\u064A\u0671]+", plain)


def _clean_inline(value: str) -> str:
    return value.replace("**", "").replace("__", "").strip()


def clean_continuation_text(text: str) -> str:
    cleaned = text.strip()
    cleaned = re.sub(r"^```[a-zA-Z]*\n?|\n?```$", "", cleaned).strip()
    cleaned = re.sub(r"^(NARRATION|narration)\s*:\s*", "", cleaned).strip()
    cleaned = cleaned.replace("**", "").replace("__", "").strip()
    if len(cleaned) >= 2 and cleaned[0] == cleaned[-1] and cleaned[0] in ('"', "”", "'"):
        cleaned = cleaned[1:-1].strip()
    return cleaned


def _strip_label_markup(text: str) -> str:
    cleaned = text.replace("**", "").replace("__", "")
    cleaned = re.sub(r"(?m)^[ \t]*[#>\-*]+[ \t]*", "", cleaned)
    return cleaned


_LABELS = (
    "HOOK|TITLE|REGION|SOURCE_SOURCE_TYPE|SOURCE_TYPE|SOURCE_REFERENCE|"
    "CAPTION|VISUAL_KEYWORDS|PHONETIC_HINTS|NARRATION"
)
_LABEL_PATTERN = re.compile(
    rf"(?:^|\n)[ \t]*({_LABELS})[ \t]*:[ \t]*(.*?)(?=\n[ \t]*(?:{_LABELS})[ \t]*:|\Z)",
    re.DOTALL,
)


def parse_labeled_response(text: str) -> dict:
    """يحلّل رد الصيغة المسمّاة (HOOK: ... NARRATION: ...) لقاموس lowercase."""
    cleaned = text.strip()
    cleaned = re.sub(r"^```[a-zA-Z]*\n?|\n?```$", "", cleaned).strip()
    cleaned = _strip_label_markup(cleaned)
    result: dict = {}
    for match in _LABEL_PATTERN.finditer(cleaned):
        key = match.group(1).strip().lower()
        if key == "source_source_type":
            key = "source_type"
        result[key] = match.group(2).strip()
    return result


def try_parse_json_episode(text: str) -> dict | None:
    """خطة بديلة لو الموديل رد JSON بدل الصيغة المسمّاة."""
    cleaned = text.strip()
    cleaned = re.sub(r"^```[a-zA-Z]*\n?|\n?```$", "", cleaned).strip()
    try:
        data = json.loads(cleaned)
    except json.JSONDecodeError:
        return None
    if not isinstance(data, dict):
        return None
    result: dict = {}
    for key in ("hook", "title", "region", "source_type", "source_reference", "caption", "narration"):
        value = data.get(key)
        if isinstance(value, str) and value.strip():
            result[key] = value.strip()
    keywords = data.get("visual_keywords")
    if isinstance(keywords, list):
        result["visual_keywords"] = ", ".join(str(item) for item in keywords)
    elif isinstance(keywords, str):
        result["visual_keywords"] = keywords
    hints = data.get("phonetic_hints")
    if isinstance(hints, list):
        result["phonetic_hints"] = "\n".join(
            f"{item.get('word', '')} = {item.get('phonetic', '')}"
            for item in hints if isinstance(item, dict)
        )
    return result or None


def parse_visual_keywords(raw: str) -> list[str]:
    keywords: list[str] = []
    for part in re.split(r"[,\n،;|]+", raw or ""):
        item = part.strip(" -•\t\"'")
        if item and re.search(r"[A-Za-z]", item) and item.lower() not in [k.lower() for k in keywords]:
            keywords.append(item)
    return keywords[:10]


def parse_phonetic_hints(raw: str) -> list[dict]:
    hints: list[dict] = []
    for line in (raw or "").splitlines():
        line = line.strip(" -•\t")
        parts = re.split(r"\s*(?:=|\||→|->)\s*", line, maxsplit=1)
        if len(parts) == 2 and parts[0].strip() and parts[1].strip():
            hints.append({"word": parts[0].strip(), "phonetic": parts[1].strip()})
    return hints[:12]


def normalize_story(fields: dict) -> dict:
    return {
        "hook": _clean_inline(fields.get("hook", "")),
        "title": _clean_inline(fields.get("title", "")),
        "region": _clean_inline(fields.get("region", "")),
        "source_type": _clean_inline(fields.get("source_type", "")),
        "source_reference": _clean_inline(fields.get("source_reference", "")),
        "caption": _clean_inline(fields.get("caption", "")),
        "narration": clean_continuation_text(fields.get("narration", "")),
        "visual_keywords": parse_visual_keywords(fields.get("visual_keywords", "")),
        "phonetic_hints": parse_phonetic_hints(fields.get("phonetic_hints", "")),
    }


def parse_story_reply(reply: str, attempt_label: str, step_label: str, fallback: dict | None = None) -> dict:
    """يحلّل رد أي نداء بيرجّع حلقة كاملة (قصة/اختصار/توسيع). لو حقل ناقص
    وفيه fallback من نداء سابق، بياخده منه (ما عدا narration)."""
    fields = parse_labeled_response(reply)
    if not all(fields.get(key, "").strip() for key in REQUIRED_STORY_FIELDS):
        json_fields = try_parse_json_episode(reply)
        if json_fields and all(json_fields.get(key, "").strip() for key in REQUIRED_STORY_FIELDS):
            print(f"   ℹ️ {attempt_label} | {step_label}: الرد جه JSON — اتقبل عن طريق الخطة البديلة.")
            fields = json_fields

    story = normalize_story(fields)
    if fallback:
        for key, value in list(story.items()):
            if key != "narration" and not value:
                story[key] = fallback.get(key, value)

    missing = [key for key in REQUIRED_STORY_FIELDS if not story.get(key)]
    if missing:
        print(f"   🔎 رد {attempt_label} | {step_label} الخام (أول 500 حرف):\n{reply[:500]!r}")
        raise AttemptFailed(f"رد {step_label} ناقص حقل '{missing[0]}' أو فاضي")
    return story


def build_episode(story: dict) -> dict:
    narration = story["narration"]
    # تلميحات النطق لازم تطابق كلمة موجودة حرفيًا في النص.
    hints = [h for h in story.get("phonetic_hints", []) if h["word"] in narration]
    keywords = list(story.get("visual_keywords") or [])
    if len(keywords) < 4:
        print("   ⚠️ كلمات البحث البصرية قليلة؛ إكمالها بكلمات احتياطية عامة")
        keywords += [k for k in DEFAULT_VISUAL_KEYWORDS if k not in keywords]
    title = (story.get("title") or story["hook"]).strip(" .؟!،")[:100]
    return {
        "title": title,
        "hook": story["hook"],
        "region": story["region"],
        "narration": narration,
        "visual_keywords": keywords,
        "caption": story.get("caption") or story["hook"],
        "phonetic_hints": hints,
        "source_type": story["source_type"],
        "source_reference": story["source_reference"],
    }


CONTENT_RED_FLAGS = ("السيلينس", "الشهرات الجوية", "المحتلة بالدقيق", "البركان الثلجي")


def find_content_red_flag(text: str) -> str | None:
    plain = re.sub(r"[\u064B-\u065F\u0670]", "", text or "")
    return next((flag for flag in CONTENT_RED_FLAGS if flag in plain), None)


def find_similar_hook(hook: str, recent_hooks: list[str]) -> str | None:
    signature = " ".join(_word_signature(hook))
    for old in recent_hooks:
        ratio = difflib.SequenceMatcher(None, signature, " ".join(_word_signature(old))).ratio()
        if ratio >= HOOK_SIMILARITY_THRESHOLD:
            return old
    return None


def validate_episode(episode: dict, recent_hooks: list[str] | None = None) -> str | None:
    """رسالة الخطأ لو الحلقة النهائية فيها مشكلة، أو None لو سليمة."""
    if not REQUIRED_EPISODE_KEYS.issubset(episode.keys()):
        return f"الحلقة ناقصة حقول مطلوبة: {sorted(episode.keys())}"

    narration = str(episode.get("narration", "")).strip()
    red_flag = find_content_red_flag(narration)
    if red_flag:
        return f"النص يحتوي مصطلحًا علميًا مرفوضًا أو مختلقًا: {red_flag}"
    if looks_truncated(narration):
        return "نص narration النهائي شكله متقطوع (مش منتهي بعلامة ترقيم واضحة)"

    word_count = count_words(narration)
    if ACCEPTABLE_MIN_WORDS > 0 and word_count < ACCEPTABLE_MIN_WORDS:
        return f"narration قصيرة جدًا ({word_count} كلمة، الحد الأدنى {ACCEPTABLE_MIN_WORDS})"

    if not episode.get("visual_keywords"):
        return "حقل visual_keywords فاضي"
    for key in ("title", "hook", "source_type", "source_reference"):
        if not str(episode.get(key, "")).strip():
            return f"حقل {key} فاضي"

    if recent_hooks:
        similar = find_similar_hook(episode["hook"], recent_hooks)
        if similar:
            return f"الهوك مشابه جدًا لهوك حلقة سابقة: {similar[:60]}"
    return None


def log_usage(response, label: str) -> None:
    usage = getattr(response, "usage_metadata", None)
    if not usage:
        return
    print(
        f"   🔢 {label} | مدخل: {usage.prompt_token_count} "
        f"| مخرج: {usage.candidates_token_count} "
        f"| إجمالي: {usage.total_token_count}"
    )


# ─────────────────────────── تصنيف الأخطاء ───────────────────────────

def _is_daily_quota_exhausted(exc: Exception) -> bool:
    """نفاد الحصة اليومية (429 + PerDay). مالوش فايدة إعادة المحاولة بعده."""
    text = str(exc).upper()
    if "RESOURCE_EXHAUSTED" not in text and "429" not in text:
        return False
    return "PERDAY" in text.replace("_", "").replace(" ", "").replace("-", "")


def _is_model_unavailable(exc: Exception) -> bool:
    text = str(exc).upper()
    return "404" in text and "NOT_FOUND" in text


def _is_transient_error(exc: Exception) -> bool:
    """ضغط مؤقت أو شبكة عابرة أو حد طلبات بالدقيقة — يستاهل إعادة محاولة."""
    if _is_daily_quota_exhausted(exc):
        return False
    text = str(exc).upper()
    if re.search(r"\b(429|500|502|503|504)\b", text):
        return True
    markers = (
        "UNAVAILABLE", "INTERNAL", "OVERLOADED", "DEADLINE_EXCEEDED",
        "TIMEOUT", "TIMED OUT", "RESOURCE_EXHAUSTED", "CONNECTION",
    )
    return any(marker in text for marker in markers)


# ─────────────────────────── مزوّد OpenRouter ───────────────────────────

class OpenRouterModels:
    """يحاكي client.models.generate_content بتاع Gemini فوق OpenRouter."""

    def generate_content(self, *, model: str, contents, config):
        messages = []
        system = getattr(config, "system_instruction", None)
        if system:
            messages.append({"role": "system", "content": str(system)})
        for content in contents:
            text = "".join(getattr(part, "text", "") or "" for part in (content.parts or []))
            messages.append({
                "role": "assistant" if content.role == "model" else "user",
                "content": text,
            })
        payload = {
            "messages": messages,
            "temperature": getattr(config, "temperature", TEMPERATURE),
            "max_tokens": getattr(config, "max_output_tokens", STORY_MAX_TOKENS),
            "reasoning": {"effort": "none", "exclude": True},
        }
        if getattr(config, "response_mime_type", "") == "application/json":
            payload["response_format"] = {"type": "json_object"}

        errors = []
        for router_model in OPENROUTER_MODELS:
            payload["model"] = router_model
            try:
                response = requests.post(
                    "https://openrouter.ai/api/v1/chat/completions",
                    headers={
                        "Authorization": f"Bearer {OPENROUTER_API_KEY}",
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://github.com/ahmedalsharqwi2-gif/islamic-reminder1",
                        "X-Title": "Islamic Reminder Auto Publisher",
                    },
                    json=payload,
                    timeout=OPENROUTER_TIMEOUT,
                )
                if response.status_code != 200:
                    raise RuntimeError(f"HTTP {response.status_code}: {response.text[:200]}")
                data = response.json()
                choice = (data.get("choices") or [{}])[0]
                content = (choice.get("message") or {}).get("content") or ""
                if isinstance(content, list):
                    content = "".join(
                        item.get("text", "") if isinstance(item, dict) else str(item)
                        for item in content
                    )
                text = str(content).strip()
                if not text:
                    raise RuntimeError("empty answer content")
                print(f"🔀 OpenRouter: using model {router_model}")

                # توحيد أسباب الإيقاف مع أسماء Gemini عشان call_model يفهمها.
                raw_reason = str(choice.get("finish_reason") or "stop").lower()
                if raw_reason == "length":
                    finish_reason = "MAX_TOKENS"
                elif raw_reason == "content_filter":
                    finish_reason = "SAFETY"
                else:
                    finish_reason = raw_reason.upper()

                usage = data.get("usage") or {}
                return SimpleNamespace(
                    text=text,
                    usage_metadata=SimpleNamespace(
                        prompt_token_count=usage.get("prompt_tokens", 0),
                        candidates_token_count=usage.get("completion_tokens", 0),
                        total_token_count=usage.get("total_tokens", 0),
                    ),
                    candidates=[SimpleNamespace(finish_reason=finish_reason)],
                )
            except Exception as exc:  # noqa: BLE001 - جرّب النموذج التالي
                errors.append(f"{router_model}: {exc}")
        raise RuntimeError("All OpenRouter models failed: " + " | ".join(errors))


class ProviderClient:
    def __init__(self, gemini_client):
        self._gemini_client = gemini_client
        self._openrouter_models = OpenRouterModels()

    @property
    def models(self):
        if ACTIVE_PROVIDER == "openrouter":
            return self._openrouter_models
        return self._gemini_client.models


def switch_to_next_model() -> bool:
    """الترتيب: نماذج Gemini الاحتياطية أولًا، ثم OpenRouter. بيرجّع False
    لو مفيش حاجة تانية نحوّل لها."""
    global ACTIVE_MODEL_INDEX, ACTIVE_MODEL, ACTIVE_PROVIDER
    if ACTIVE_PROVIDER == "gemini":
        if ACTIVE_MODEL_INDEX + 1 < len(MODEL_CANDIDATES):
            ACTIVE_MODEL_INDEX += 1
            ACTIVE_MODEL = MODEL_CANDIDATES[ACTIVE_MODEL_INDEX]
            return True
        if OPENROUTER_API_KEY and OPENROUTER_MODEL:
            ACTIVE_PROVIDER = "openrouter"
            ACTIVE_MODEL = OPENROUTER_MODEL
            print(f"🔁 انتقلت إلى OpenRouter كخطة احتياطية: {OPENROUTER_MODEL}")
            return True
    return False


# ─────────────────────────── نداء الموديل ───────────────────────────

def make_content(role: str, text: str) -> types.Content:
    return types.Content(role=role, parts=[types.Part(text=text)])


def _config(system_prompt: str, budget: int, *, temperature: float = TEMPERATURE,
            thinking: int = THINKING_BUDGET, **extra) -> types.GenerateContentConfig:
    return types.GenerateContentConfig(
        system_instruction=system_prompt,
        temperature=temperature,
        max_output_tokens=budget,
        thinking_config=types.ThinkingConfig(thinking_budget=thinking),
        # بيسكّت تحذير AFC؛ السكريبت مبيستخدمش أدوات أصلًا.
        automatic_function_calling=types.AutomaticFunctionCallingConfig(disable=True),
        **extra,
    )


def free_text_config(system_prompt: str, budget: int) -> types.GenerateContentConfig:
    return _config(system_prompt, budget)


def tashkeel_json_config(system_prompt: str, budget: int) -> types.GenerateContentConfig:
    return _config(
        system_prompt, budget, temperature=0.1, thinking=0,
        response_mime_type="application/json",
        response_schema=to_gemini_schema(TASHKEEL_SCHEMA),
    )


def _generate_with_retries(client, contents, config_builder, system_prompt: str, budget: int, label: str):
    """نداء واحد مع إعادة محاولة متصاعدة للأخطاء المؤقتة."""
    last_exc: Exception | None = None
    for retry in range(TRANSIENT_RETRIES + 1):
        try:
            return client.models.generate_content(
                model=ACTIVE_MODEL, contents=contents,
                config=config_builder(system_prompt, budget),
            )
        except Exception as exc:  # noqa: BLE001 — شبكة/حصة/حجب أمان
            last_exc = exc
            if _is_daily_quota_exhausted(exc):
                raise QuotaExhausted(
                    f"نفدت الحصة اليومية لموديل {ACTIVE_MODEL} أثناء {label} ({exc})"
                ) from exc
            if _is_model_unavailable(exc):
                raise ModelUnavailable(
                    f"الموديل {ACTIVE_MODEL} غير متاح أثناء {label} ({exc})"
                ) from exc
            if not _is_transient_error(exc):
                raise AttemptFailed(f"فشل استدعاء الموديل في {label} ({exc})") from exc
            if retry < TRANSIENT_RETRIES:
                wait = TRANSIENT_BACKOFF_BASE * (2 ** retry)
                print(f"   ⏳ {label}: خطأ مؤقت ({str(exc)[:120]}) — إعادة بعد {wait} ثانية "
                      f"({retry + 1}/{TRANSIENT_RETRIES})...")
                time.sleep(wait)
    raise ProviderFailover(
        f"استُنفدت إعادات الخطأ المؤقت لموديل {ACTIVE_MODEL} في {label} ({last_exc})"
    ) from last_exc


def call_model(client, history: list, prompt_text: str, config_builder,
               system_prompt: str, budget: int, label: str):
    """يبعت prompt_text كدور جديد فوق history ويضيف الدور للـ history بعد
    ما يستقر على رد نهائي. بيرجّع (نص الرد, finish_reason).
      - MAX_TOKENS (أو length من OpenRouter): يرفع السقف ويعيد (BUDGET_RETRIES).
      - خطأ مؤقت: إعادة بانتظار متصاعد ثم ProviderFailover.
      - حصة يومية: QuotaExhausted فورًا."""
    attempt_budget = budget
    response = None
    finish_reason = ""
    for length_retry in range(BUDGET_RETRIES + 1):
        contents = history + [make_content("user", prompt_text)]
        response = _generate_with_retries(
            client, contents, config_builder, system_prompt, attempt_budget, label
        )
        log_usage(response, label)
        candidates = getattr(response, "candidates", None) or []
        finish_reason = str(candidates[0].finish_reason) if candidates else ""
        if "MAX_TOKENS" in finish_reason and length_retry < BUDGET_RETRIES:
            attempt_budget = int(attempt_budget * LENGTH_ESCALATION)
            print(f"   ⚠️ {label}: اتقطع بحد التوكنز — رفع السقف لـ {attempt_budget} وإعادة النداء...")
            continue
        break

    if any(flag in finish_reason for flag in ("SAFETY", "PROHIBITED", "BLOCKLIST")):
        raise AttemptFailed(f"الرد اتحجب في {label} (finish_reason={finish_reason})")

    reply_text = response.text or ""
    history.append(make_content("user", prompt_text))
    history.append(make_content("model", reply_text))
    return reply_text, finish_reason


