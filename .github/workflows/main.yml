name: Create and Publish Historical Strategy Episode

on:
  schedule:
    # يبدأ التوليد الساعة 13:30 UTC (16:30 القاهرة)، والنشر يُحسب ثابتًا عند 19:00 القاهرة.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      voice_profile:
        description: "اختر صوت الراوي لهذا الفيديو"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - mohamed_elbed
          - rafik_sa
          - egyptian_female
          - hossam
          - hossam_uploaded
          - marwan
          - nassim
          - ahmed_z
      dry_run:
        description: "Build and validate without publishing externally"
        required: false
        default: false
        type: boolean

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: historical-strategy-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Verify faster-whisper is importable on the same interpreter
        run: python -c "import faster_whisper; print('faster-whisper OK:', faster_whisper.__file__)"

      - name: Verify Arabic narration guard
        run: python -m unittest tests.test_arabic_guard -v

      - name: Generate complete historical strategy episode script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Gemini هو النموذج الأساسي، وOpenRouter خطة احتياطية مستقلة.
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_FALLBACK_MODELS: "gemini-3.5-flash-lite"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "google/gemini-2.5-flash,qwen/qwen3-32b"
          OPENROUTER_TIMEOUT: "90"
          GEMINI_THINKING_BUDGET: "0"
          TARGET_WORDS: "850"
          ACCEPTABLE_MIN_WORDS: "300"
          OPENROUTER_MIN_WORDS: "300"
          MAX_FULL_ATTEMPTS: "2"
          MAX_EXPANSION_ROUNDS: "1"
          TRANSIENT_RETRIES: "5"
          TRANSIENT_BACKOFF_BASE: "8"
          BUDGET_RETRIES: "0"
          PROOFREAD_TASHKEEL: "false"
        run: python scripts/generate_script.py

      - name: Fetch landscape stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate narration with the selected SILMA reference voice
        env:
          TTS_ENGINE: "silma"
          SILMA_REFERENCE_PROFILE: ${{ github.event.inputs.voice_profile || 'auto' }}
          SILMA_VOICE_PROFILES_FILE: "assets/voices/voice_profiles.json"
          SILMA_SPEED: "1.00"
          SILMA_GUARD_ENABLED: "true"
          SILMA_GUARD_MIN_MATCH_WORDS: "4"
          SILMA_FALLBACK_TO_EDGE: "false"
          WHISPER_MODEL: "base"
          ASR_MIN_MATCH_RATIO: "0.82"
          # Mantoq يتطلب numpy>=2 بينما silma-tts يتطلب numpy<=1.26؛
          # نستخدم القاموس والتشكيل المحلي داخل بيئة SILMA، ونجعل Mantoq
          # اختياريًا فقط في بيئة منفصلة حتى لا يفشل تثبيت كل التشغيل.
          MANTOQ_REQUIRED: "false"
          EDGE_TTS_RATE: "+10%"
          EDGE_TTS_PITCH: "-5Hz"
        run: python scripts/generate_voice.py

      - name: Assemble full landscape video and platform reel
        run: python scripts/assemble_video.py

      - name: Publish full video and reel together
        if: ${{ !inputs.dry_run }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_VIDEO_DELAY_HOURS: "8"
          FULL_TO_SHORT_1_HOURS: "8"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      # Buffer لا يدعم فيديوهات YouTube الطويلة؛ يتم نشر الفيديو الكامل
      # مباشرة عبر YouTube Data API.
      - name: Publish full video directly to YouTube
        if: ${{ !inputs.dry_run }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FULL_VIDEO_DELAY_HOURS: "8"
        run: python scripts/publish_youtube_direct.py

      - name: Check YouTube token age
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_youtube_token_age.py

      - name: Upload generated media artifacts
        uses: actions/upload-artifact@v5
        with:
          name: historical-strategy-episode-media-${{ github.run_id }}
          path: |
            output/final_video_full.mp4
            output/short_*.mp4
            state/current_episode.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit clip tracking state only
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json state/yt_token_last_success.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في حالة الكليبات"
            exit 0
          fi
          git commit -m "chore: update used clips tracking [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "إعادة محاولة push رقم $attempt"
            sleep $((attempt * 5))
          done
          echo "فشل push بعد 5 محاولات"
          exit 1
