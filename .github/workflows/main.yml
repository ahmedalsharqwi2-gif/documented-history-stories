name: Create and Publish Islamic History Episode

on:
  schedule:
    # الـ workflow بيتشغّل الساعة 08:00 UTC (11ص القاهرة، UTC+3) —
    # ده معاد بدء التوليد بس، مش معاد النشر الفعلي؛ النشر نفسه مجدول
    # (dueAt عند Buffer، publishAt عند يوتيوب) على مواعيد منفصلة تحت.
    #
    # الفيديو الكامل والريل (شورت واحد بس، مقتطف من أول الفيديو، وفي
    # آخره تنويه أعلى الشاشة "شاهد بقية الفيديو على الصفحة") بينشروا
    # معًا في نفس التوقيت: مساءً الساعة ~7م نفس يوم التشغيل (تأخير 8
    # ساعات من معاد التشغيل صباحًا). القيمتين FULL_VIDEO_DELAY_HOURS
    # وFULL_TO_SHORT_1_HOURS في خطوة النشر تحت متساويتين عمدًا (8) عشان
    # ينشروا مع بعض بالظبط.
    - cron: "0 8 * * *"
  workflow_dispatch:

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: islamic-history-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      # فشل الـ import هنا صامت لو حصل من غير السطر ده — pip منفصل عن
      # "python -m pip" ممكن يثبّت الحزم على تفسير Python مختلف عن اللي
      # بيشغّل main.py فعليًا، فيرجع realign_subtitles_with_whisper()
      # بصمت لتوقيتات edge-tts الأقل دقة (سبب عدم تزامن الترجمة اللي
      # ظهر قبل كده). السطر ده بيفشل الـ run فورًا وبوضوح لو تكرر نفس
      # الخطأ، بدل ما يتخبى جوه try/except ويكمّل بجودة أقل من غير تنبيه.
      - name: Verify faster-whisper is importable on the same interpreter
        run: python -c "import faster_whisper; print('faster-whisper OK:', faster_whisper.__file__)"

      - name: Generate complete episode script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # اترفعت من 0 عشان الهدف الجديد (970+ كلمة مع ترجمة متزامنة
          # جملة بجملة) مهمة تخطيط أعقد بكتير من توليد JSON بسيط، وبقيمة
          # صفر كان الموديل بيتسرّع ويقطع القصة قبل ما يخلصها (شوف
          # previous_truncated في generate_script.py).
          GEMINI_THINKING_BUDGET: "2048"
          # مرفوعين عشان الفيديو الكامل يتخطى 5 دقايق (300 ثانية) دايمًا:
          # حسب النسبة الموثقة في generate_script.py (300 كلمة ≈ 94-150
          # ثانية حسب سرعة النطق)، MIN_NARRATION_WORDS=970 بيضمن تخطي 5
          # دقايق حتى في أسرع سيناريو نطق محتمل (970×0.313≈304 ثانية).
          TARGET_WORDS: "1050"
          MIN_NARRATION_WORDS: "970"
        run: python scripts/generate_script.py

      - name: Fetch landscape stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate complete narration and landscape subtitles
        run: python scripts/generate_voice.py

      - name: Assemble full landscape video and platform reel
        run: python scripts/assemble_video.py

      - name: Publish full video and reel together
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # نفس القيمة للاتنين عمدًا: الفيديو الكامل والريل ينشروا معًا
          # الساعة 7 مساءً بالظبط (شوف تعليق cron فوق).
          FULL_VIDEO_DELAY_HOURS: "8"
          FULL_TO_SHORT_1_HOURS: "8"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      # Buffer لا يدعم فيديوهات يوتيوب الطويلة (Long-form) إطلاقًا — يدعم
      # YouTube Shorts فقط، لذلك الفيديو الكامل يُنشر ليوتيوب هنا بشكل
      # منفصل عبر YouTube Data API مباشرة (شوف publish_youtube_direct.py).
      # FULL_VIDEO_DELAY_HOURS لازم تكون نفس قيمة الخطوة اللي فاتت، عشان
      # يوتيوب ينشر في نفس توقيت باقي المنصات مساءً بدل النشر الفوري.
      - name: Publish full video directly to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FULL_VIDEO_DELAY_HOURS: "8"
        run: python scripts/publish_youtube_direct.py

      # تحذير مبكر قبل انتهاء صلاحية YT_REFRESH_TOKEN (7 أيام لتطبيق في
      # وضع Testing عند Google) — بيفتح GitHub Issue قبل الموعد بأيام
      # أمان بدل ما ننتظر فشل النشر فعليًا. يشتغل دايمًا (always())، حتى
      # لو الخطوة اللي فاتت فشلت، عشان يفضل يقرأ آخر تاريخ نجاح معروف.
      - name: Check YouTube token age
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_youtube_token_age.py

      - name: Upload generated media artifacts
        uses: actions/upload-artifact@v5
        with:
          name: islamic-history-episode-media-${{ github.run_id }}
          path: |
            output/final_video_full.mp4
            output/short_*.mp4
            state/current_episode.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit clip tracking state only
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json state/yt_token_last_success.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في حالة الكليبات"
            exit 0
          fi
          git commit -m "chore: update used clips tracking [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "إعادة محاولة push رقم $attempt"
            sleep $((attempt * 5))
          done
          echo "فشل push بعد 5 محاولات"
          exit 1
