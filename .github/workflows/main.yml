"""
generate_script.py — النسخة 3

يولّد حلقة تاريخية كاملة (قصة + عنوان + وصف + كلمات بحث بصرية + تلميحات
نطق + مرجع توثيق) بنداء واحد لـ Gemini، مع OpenRouter كخطة احتياطية.

ما الجديد في هذه النسخة:
  1) نداء واحد يبني كل حقول الحلقة. حقل NARRATION آخر حقل في الرد، فلو
     اتقطع الرد بيضيع من القصة بس، مش من باقي الحقول. ألغينا نداء
     finalize، فالعنوان والوصف وكلمات البحث بقت من نفس السياق اللي كتب
     القصة (جودة أعلى) وبتكلفة أقل.
  2) سقف صريح للطول في البرومبت + نداء "اختصار" لو الرد طلع أطول بكثير
     من الهدف (زي 3378 كلمة والهدف 850).
  3) اعتبار finish_reason=length (OpenRouter) قطعًا بسبب التوكنز زي
     MAX_TOKENS تمامًا.
  4) تحويل المزوّد (Gemini -> نموذج احتياطي -> OpenRouter) لا يستهلك من
     MAX_FULL_ATTEMPTS.
  5) إعادة محاولة أذكى لأخطاء 429/5xx المؤقتة، وباك-أوف قابل للضبط من
     البيئة، وفصل نفاد الحصة اليومية عن الأخطاء العابرة.
  6) زاوية قصة مقترحة تتبدّل يوميًا لتنويع القناة، وفحص تشابه الهوك مع
     الحلقات السابقة.
  7) إسكات تحذير AFC عبر AutomaticFunctionCallingConfig(disable=True).
  8) التدقيق بالتشكيل اختياري (PROOFREAD_TASHKEEL) وبيشتغل بسياق نظيف.

⚠️ الموديل لا يستطيع التحقق من صحة أي رواية تاريخية بشكل قاطع. حقلا
source_type وsource_reference يجبرانه على التصريح بمرجعه لتسهيل
المراجعة البشرية، خصوصًا في الوقائع الإسلامية.

متغيرات البيئة (كلها اختيارية): GEMINI_API_KEY, GEMINI_MODEL,
GEMINI_FALLBACK_MODELS, OPENROUTER_API_KEY, OPENROUTER_MODEL,
OPENROUTER_TIMEOUT, GEMINI_THINKING_BUDGET, TARGET_WORDS,
ACCEPTABLE_MIN_WORDS, MAX_FULL_ATTEMPTS, MAX_EXPANSION_ROUNDS,
TRANSIENT_RETRIES, TRANSIENT_BACKOFF_BASE, BUDGET_RETRIES,
STORY_MAX_TOKENS, PROOFREAD_TASHKEEL, TEMPERATURE.
"""
