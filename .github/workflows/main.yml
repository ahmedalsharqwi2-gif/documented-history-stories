class AttemptFailed(Exception):
    """فشل متوقّع داخل محاولة كاملة؛ الحلقة الخارجية تبدأ محاولة جديدة."""


class QuotaExhausted(Exception):
    """نفاد الحصة اليومية للنموذج الحالي."""


class ModelUnavailable(Exception):
    """النموذج غير موجود أو لم يعد متاحًا (404)."""


class ProviderFailover(Exception):
    """استُنفدت إعادات الأخطاء المؤقتة؛ لازم نحوّل لمزوّد/نموذج تاني."""


def to_gemini_schema(schema: dict) -> dict:
    """JSON Schema عادي -> صيغة Gemini (أنواع uppercase)."""
    gemini_type = schema["type"].upper()
    result: dict = {"type": gemini_type}
    if gemini_type == "OBJECT":
        result["properties"] = {
            key: to_gemini_schema(value)
            for key, value in schema.get("properties", {}).items()
        }
        if "required" in schema:
            result["required"] = schema["required"]
    elif gemini_type == "ARRAY":
        result["items"] = to_gemini_schema(schema["items"])
    return result


