name: VoiceTut Egyptian Voice Sample
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'voice_lab/voicetut_sample.py'
      - '.github/workflows/voicetut-sample.yml'
permissions:
  contents: read
concurrency:
  group: voicetut-egyptian-sample
  cancel-in-progress: false
jobs:
  synthesize-voicetut:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: voicetut-44cba00cd3ddb04b5213353e19e960045e332da7-08be0b4ccbac3e13e374e86fbfead4b4cac343e2-cpu-v1
      - name: Install pinned VoiceTut and OmniVoice on CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' 'torchvision==0.23.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'transformers==5.3.0' 'git+https://github.com/k2-fsa/OmniVoice.git@08be0b4ccbac3e13e374e86fbfead4b4cac343e2' 'git+https://github.com/MohammedAly22/VoiceTuT-TTS.git@44cba00cd3ddb04b5213353e19e960045e332da7'
          python -m pip freeze > voicetut-dependencies.txt
      - name: Generate the same new Egyptian paragraph with Mohammed
        run: python voice_lab/voicetut_sample.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voicetut-new-egyptian-sample
          path: |
            voicetut-output/
            voicetut-dependencies.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Save playable audio and exact model settings
        env:
          RESULT_BRANCH: codex/voicetut-sample-${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="voice-samples/voicetut/$RUN_NUMBER"
          mkdir -p "$target"
          cp voicetut-output/* "$target/"
          git switch -c "$RESULT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Add newly synthesized VoiceTut Egyptian paragraph and provenance"
          git push origin "$RESULT_BRANCH"
