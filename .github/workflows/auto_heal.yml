From 09e9371c573fec8e9e44e50eb6a7bff7cdcfe876 Mon Sep 17 00:00:00 2001
From: fix <fix@example.com>
Date: Mon, 5 Oct 2026 13:51:43 +0000
Subject: [PATCH] fix: surface all fallback model errors, handle OpenRouter
 402, mark start provider visited, drop retired llama model

---
 .github/workflows/main.yml |  2 +-
 config/model_policy.json   |  3 +-
 scripts/generate_script.py | 56 ++++++++++++++++++++++++++++++++++---
 tests/test_llm_fallback.py | 57 ++++++++++++++++++++++++++++++++++++++
 4 files changed, 111 insertions(+), 7 deletions(-)

diff --git a/.github/workflows/main.yml b/.github/workflows/main.yml
index c712fef..0c1f76f 100644
--- a/.github/workflows/main.yml
+++ b/.github/workflows/main.yml
@@ -134,7 +134,7 @@ jobs:
           # The catalog endpoint can be forbidden while chat completion still
           # works. Keep an ordered, replaceable list so one exhausted model
           # cannot take down the whole production run.
-          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS || 'openai/gpt-oss-120b,openai/gpt-oss-20b,llama-3.3-70b-versatile' }}
+          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS || 'openai/gpt-oss-120b,openai/gpt-oss-20b' }}
           OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
           MODEL_POLICY_FILE: config/model_policy.json
         run: python scripts/model_preflight.py
diff --git a/config/model_policy.json b/config/model_policy.json
index 0f45097..6361bf7 100644
--- a/config/model_policy.json
+++ b/config/model_policy.json
@@ -19,8 +19,7 @@
       "enabled": true,
       "preferred_models": [
         "openai/gpt-oss-120b",
-        "openai/gpt-oss-20b",
-        "llama-3.3-70b-versatile"
+        "openai/gpt-oss-20b"
       ],
       "retry_statuses": [
         429,
diff --git a/scripts/generate_script.py b/scripts/generate_script.py
index 39e1f2a..345ab2c 100644
--- a/scripts/generate_script.py
+++ b/scripts/generate_script.py
@@ -124,6 +124,8 @@ if _FALLBACK_MODELS_DISCOVERED:
     FALLBACK_MODELS = list(dict.fromkeys(_FALLBACK_MODELS_DISCOVERED))
 FALLBACK_MODEL = FALLBACK_MODELS[0] if FALLBACK_MODELS else ""
 FALLBACK_TIMEOUT = int(os.getenv("LLM_FALLBACK_TIMEOUT", "90"))
+# Below this many affordable tokens a story cannot be written; treat as no credits.
+MIN_AFFORDABLE_TOKENS = int(os.getenv("MIN_AFFORDABLE_TOKENS", "600"))
 FALLBACK_MAX_TOKENS = int(os.getenv("LLM_FALLBACK_MAX_TOKENS", "3500"))
 ACTIVE_PROVIDER = "gemini"
 # Providers are tried at most once per run.  Without this guard, a failed
@@ -851,7 +853,8 @@ class CompatibleChatModels:
             payload["response_format"] = {"type": "json_object"}
         errors = []
         typed_errors = []
-        for router_model in self.models:
+        retired_models = []
+        for router_model in list(self.models):
             payload["model"] = router_model
             try:
                 response = requests.post(
@@ -865,12 +868,38 @@ class CompatibleChatModels:
                     json=payload,
                     timeout=(FALLBACK_TIMEOUT if self.title == "Fallback LLM" else OPENROUTER_TIMEOUT),
                 )
-                if response.status_code in (401, 402, 403, 429):
+                if response.status_code == 402:
+                    # OpenRouter: "can only afford N tokens". Retry once with
+                    # the affordable budget when it is still usable; otherwise
+                    # report clearly that credits are exhausted.
+                    match = re.search(r"can only afford (\d+)", response.text or "")
+                    affordable = int(match.group(1)) if match else 0
+                    if affordable >= MIN_AFFORDABLE_TOKENS and affordable < payload["max_tokens"]:
+                        payload["max_tokens"] = affordable
+                        response = requests.post(
+                            self.endpoint,
+                            headers={
+                                "Authorization": f"Bearer {self.api_key}",
+                                "Content-Type": "application/json",
+                                "HTTP-Referer": "https://github.com/ahmedalsharqwi2-gif/documented-history-stories",
+                                "X-Title": self.title,
+                            },
+                            json=payload,
+                            timeout=(FALLBACK_TIMEOUT if self.title == "Fallback LLM" else OPENROUTER_TIMEOUT),
+                        )
+                if response.status_code == 402:
+                    raise QuotaExhausted(
+                        f"{self.title}: رصيد الحساب غير كافٍ (HTTP 402) — اشحن الرصيد أو "
+                        f"استخدم موديلات :free. {response.text[:200]}"
+                    )
+                if response.status_code in (401, 403, 429):
                     raise QuotaExhausted(
                         f"{self.title} غير متاح حاليًا (HTTP {response.status_code}): "
                         f"{response.text[:200]}"
                     )
                 if response.status_code != 200:
+                    if response.status_code == 404:
+                        retired_models.append(router_model)
                     if response.status_code in (400, 404):
                         raise ModelUnavailable(
                             f"{self.title} model/request unavailable (HTTP {response.status_code}): "
@@ -909,9 +938,23 @@ class CompatibleChatModels:
         # Preserve the actionable error class after all models at this
         # provider fail.  The caller uses it to move to the next provider;
         # wrapping it in RuntimeError used to make the fallback chain stop.
+        # A model that returned 404 no longer exists for this key; stop
+        # sending it on later calls in this run.
+        for dead in retired_models:
+            if dead in self.models and len(self.models) > 1:
+                self.models.remove(dead)
         if typed_errors:
-            raise typed_errors[-1]
-        raise RuntimeError("All OpenRouter models failed: " + " | ".join(errors))
+            # Report EVERY model's error. Raising only the last one used to
+            # hide the real failure (e.g. a 429 on gpt-oss-120b was reported
+            # as a 404 on the retired llama model at the end of the list).
+            combined = " | ".join(errors)
+            error_cls = (
+                QuotaExhausted
+                if any(isinstance(e, QuotaExhausted) for e in typed_errors)
+                else ModelUnavailable
+            )
+            raise error_cls(combined)
+        raise RuntimeError("All provider models failed: " + " | ".join(errors))
 
 
 class ProviderClient:
@@ -1058,6 +1101,8 @@ def call_model(
                 )
                 last_exc = None
                 break
+            except (QuotaExhausted, ModelUnavailable):
+                raise
             except Exception as exc:  # noqa: BLE001
                 last_exc = exc
                 if _is_daily_quota_exhausted(exc):
@@ -1509,6 +1554,9 @@ def generate_episode() -> dict:
         else:
             sys.exit("MODEL_PREFLIGHT_ERROR: no validated fallback model is available")
         client = ProviderClient(None)
+        # The provider we start on counts as visited, otherwise the chain
+        # bounces back to it after OpenRouter fails.
+        VISITED_PROVIDERS.add(ACTIVE_PROVIDER)
     system_prompt = load_system_prompt()
     recent_titles = load_used_history()
     recent_regions = load_used_regions()
diff --git a/tests/test_llm_fallback.py b/tests/test_llm_fallback.py
index a013d30..f625a6f 100644
--- a/tests/test_llm_fallback.py
+++ b/tests/test_llm_fallback.py
@@ -161,6 +161,63 @@ class DocumentedHistoryFallbackTests(unittest.TestCase):
             client.generate_content(model="model", contents=[content], config=config)
         self.assertLess(post.call_args.kwargs["json"]["max_tokens"], 1800)
 
+    def _resp(self, status, text="", body=None):
+        attrs = {"status_code": status, "text": text}
+        if body is not None:
+            attrs["json"] = lambda self: body
+        return type("Response", (), attrs)()
+
+    def test_combined_error_keeps_real_failure_of_earlier_models(self):
+        responses = [
+            self._resp(429, "tpm limit on first model"),
+            self._resp(429, "tpm limit on second model"),
+            self._resp(404, "model_not_found llama"),
+        ]
+        client = gs.CompatibleChatModels("k", "https://example.invalid", ["a", "b", "c"], "Fallback LLM")
+        with patch.object(gs.requests, "post", side_effect=responses):
+            with self.assertRaises(gs.QuotaExhausted) as ctx:
+                client.generate_content(model="a", contents=[], config=object())
+        self.assertIn("tpm limit on first model", str(ctx.exception))
+        self.assertIn("model_not_found", str(ctx.exception))
+
+    def test_retired_model_is_dropped_after_404(self):
+        ok = self._resp(200, "", {"choices": [{"message": {"content": "نص"}}], "usage": {}})
+        client = gs.CompatibleChatModels("k", "https://example.invalid", ["a", "dead"], "Fallback LLM")
+        with patch.object(gs.requests, "post", side_effect=[self._resp(429, "x"), self._resp(404, "nf")]):
+            with self.assertRaises(gs.QuotaExhausted):
+                client.generate_content(model="a", contents=[], config=object())
+        self.assertEqual(client.models, ["a"])
+
+    def test_openrouter_402_retries_with_affordable_tokens(self):
+        poor = self._resp(402, "You requested up to 1800 tokens, but can only afford 900.")
+        ok = self._resp(200, "", {"choices": [{"message": {"content": "نص"}}], "usage": {}})
+        client = gs.CompatibleChatModels("k", "https://example.invalid", ["m"], "OpenRouter")
+        config = type("C", (), {"system_instruction": "s", "temperature": 0.2, "max_output_tokens": 1800})()
+        with patch.object(gs.requests, "post", side_effect=[poor, ok]) as post:
+            result = client.generate_content(model="m", contents=[], config=config)
+        self.assertEqual(result.text, "نص")
+        self.assertEqual(post.call_args.kwargs["json"]["max_tokens"], 900)
+
+    def test_openrouter_402_with_tiny_budget_reports_credits_exhausted(self):
+        poor = self._resp(402, "You requested up to 1800 tokens, but can only afford 190.")
+        client = gs.CompatibleChatModels("k", "https://example.invalid", ["m"], "OpenRouter")
+        config = type("C", (), {"system_instruction": "s", "temperature": 0.2, "max_output_tokens": 1800})()
+        with patch.object(gs.requests, "post", return_value=poor) as post:
+            with self.assertRaises(gs.QuotaExhausted) as ctx:
+                client.generate_content(model="m", contents=[], config=config)
+        self.assertEqual(post.call_count, 1)
+        self.assertIn("رصيد", str(ctx.exception))
+
+    def test_call_model_does_not_reclassify_typed_provider_errors(self):
+        class Boom:
+            class models:
+                @staticmethod
+                def generate_content(**kwargs):
+                    raise gs.QuotaExhausted("429 first | 404 NOT_FOUND last")
+        with self.assertRaises(gs.QuotaExhausted) as ctx:
+            gs.call_model(Boom, [], "p", lambda sp, b: object(), "sys", 100, "t")
+        self.assertIn("429 first", str(ctx.exception))
+
 
 if __name__ == "__main__":
     unittest.main()
