name: Complete Voice Listening Lab and Tail Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-voice-lab.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_XET: '1'
  TOKENIZERS_PARALLELISM: 'false'
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install huggingface_hub
          python audio_repair/samples.py catalogue
      - uses: actions/upload-artifact@v4
        with: {name: all-original-library-voices, path: audio-lab/catalogue/}
      - env:
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="voice-lab/$RUN_NUMBER/catalogue"
          mkdir -p "$target"
          cp -r audio-lab/catalogue/* "$target/"
          git fetch origin main
          git switch --discard-changes -c "codex/voice-catalogue-$RUN_NUMBER" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save actual voice tests or verified audio delivery repair"
          git push origin "codex/voice-catalogue-$RUN_NUMBER"
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: feature-ready-to-render
          path: feature-work
          run-id: '39493924939'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: abu-simbel-polished-final
          path: polished-source
          run-id: '39504425549'
          github-token: ${{ github.token }}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install numpy==1.26.4
          python audio_repair/fix_video.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tail-fixed-video, path: audio-fixed/, retention-days: 30}
      - env:
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="audio-deliveries/$RUN_NUMBER"
          mkdir -p "$target"
          cp -r audio-fixed/* "$target/"
          git fetch origin main
          git switch --discard-changes -c "codex/audio-tail-fixed-$RUN_NUMBER" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save actual voice tests or verified audio delivery repair"
          git push origin "codex/audio-tail-fixed-$RUN_NUMBER"
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - speaker: Mohammed
            condition: raw
          - speaker: Mohammed
            condition: vowelled
          - speaker: Mohammed
            condition: msa
          - speaker: Mohammed
            condition: slow
          - speaker: Ali
            condition: vowelled
          - speaker: Hassan
            condition: vowelled
          - speaker: Karim
            condition: vowelled
          - speaker: Mahmoud
            condition: vowelled
          - speaker: Mostafa
            condition: vowelled
          - speaker: Ramy
            condition: vowelled
          - speaker: Shaker
            condition: vowelled
          - speaker: Tareq
            condition: vowelled
          - speaker: Yehia
            condition: vowelled
          - speaker: Hadeer
            condition: vowelled
          - speaker: Hanan
            condition: vowelled
          - speaker: Mariam
            condition: vowelled
          - speaker: Rana
            condition: vowelled
          - speaker: Sarah
            condition: vowelled
          - speaker: Yasmin
            condition: vowelled
          - speaker: Yara
            condition: vowelled
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: voicetut-44cba00cd3ddb04b5213353e19e960045e332da7-08be0b4ccbac3e13e374e86fbfead4b4cac343e2-cpu-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          bash voice_provider/install.sh
          python -m pip install numpy==1.26.4 faster-whisper==1.2.1
      - name: Generate a new common sentence in the specified voice and condition
        env:
          SPEAKER: ${{ matrix.speaker }}
          CONDITION: ${{ matrix.condition }}
        run: |
          timeout 1050 "$VOICETUT_PYTHON" audio_repair/samples.py generate --speaker "$SPEAKER" --condition "$CONDITION"
          python audio_repair/samples.py audit --speaker "$SPEAKER" --condition "$CONDITION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-lab-${{ matrix.speaker }}-${{ matrix.condition }}
          path: audio-lab/generated/
          retention-days: 30
  alternative:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install edge-tts
          python audio_repair/samples.py edge
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: alternative-engine-tests, path: audio-lab/alternative/}
  publish:
    needs: [trial, alternative]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with: {pattern: 'voice-lab-*', merge-multiple: true, path: voice-comparisons/generated}
      - uses: actions/download-artifact@v4
        with: {name: alternative-engine-tests, path: voice-comparisons/alternative}
      - env:
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="voice-lab/$RUN_NUMBER"
          mkdir -p "$target"
          cp -r voice-comparisons/* "$target/"
          git fetch origin main
          git switch --discard-changes -c "codex/voice-lab-$RUN_NUMBER" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save actual voice tests or verified audio delivery repair"
          git push origin "codex/voice-lab-$RUN_NUMBER"
