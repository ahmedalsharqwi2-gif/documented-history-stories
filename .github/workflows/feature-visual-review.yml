name: Abu Simbel Visual Review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/feature-visual-review.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: video-toolkit/package-lock.json}
      - name: Load actual earlier Gemini draft for layout review only
        run: |
          mkdir -p feature-work/public
          curl -fL 'https://raw.githubusercontent.com/ahmedalsharqwi2-gif/documented-history-stories/codex/gemini-feature-plan-39491573950/motion-feature-plans/39491573950/plan.json' -o feature-work/plan.json
          cp photo_motion/assets/NotoSansArabic-Bold.ttf feature-work/public/
          npm ci --prefix video-toolkit --no-audit --no-fund
          cd video-toolkit
          npx playwright install --with-deps chromium
          node scripts/review-feature.mjs
      - uses: actions/upload-artifact@v4
        with: {name: abu-simbel-layout-review, path: feature-review/}
      - name: Save review frames
        env:
          RESULT_BRANCH: codex/abu-simbel-review-${{ github.run_id }}
        run: |
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature-review
          git commit -m "Save rendered Abu Simbel layout review stills"
          git push origin "$RESULT_BRANCH"
