name: Arabic Guard CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  arabic-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt 2>/dev/null || python -m pip install -r requirements.txt 2>/dev/null || echo "No requirements file found"

      - name: Run Arabic guard tests
        run: |
          echo "Testing Arabic Guard module..."
          python -m unittest discover -s tests -p 'test_arabic_guard.py' -v

      - name: Verify test module import
        run: |
          echo "Verifying imports..."
          python -c "
          import sys
          from pathlib import Path
          ROOT = Path('.').resolve()
          for candidate in (ROOT, ROOT / 'scripts'):
              if candidate.exists() and str(candidate) not in sys.path:
                  sys.path.insert(0, str(candidate))
          try:
              from arabic_guard import validate_narration, Issue
              print(f'✓ arabic_guard module found')
              print(f'✓ validate_narration function: {validate_narration}')
              print(f'✓ Issue class: {Issue}')
          except ImportError as e:
              print(f'✗ Import failed: {e}')
              sys.exit(1)
          "

      - name: Quick sanity check
        run: |
          echo "Running sanity checks..."
          python - <<'PYTHON'
          import sys
          from pathlib import Path
          
          ROOT = Path('.').resolve()
          for candidate in (ROOT, ROOT / 'scripts'):
              if candidate.exists() and str(candidate) not in sys.path:
                  sys.path.insert(0, str(candidate))
          
          from arabic_guard import validate_narration
          
          # Test 1: Clean Arabic should pass
          result = validate_narration("السلام عليكم ورحمة الله وبركاته")
          assert result == [], f"Expected clean text to pass, got {result}"
          print("✓ Test 1 passed: Clean Arabic text accepted")
          
          # Test 2: Foreign script should fail
          result = validate_narration("في 14 أغسطس carrying a crew")
          kinds = {issue.kind for issue in result}
          assert "foreign_script" in kinds, f"Expected foreign_script error, got {kinds}"
          assert "digit" in kinds, f"Expected digit error, got {kinds}"
          print("✓ Test 2 passed: Foreign script and digits detected")
          
          # Test 3: Low ratio should fail
          result = validate_narration("hello مرحبا")
          assert any(issue.kind == "foreign_script" for issue in result), "Expected foreign script detection"
          print("✓ Test 3 passed: Low Arabic ratio detection working")
          
          print("\n✓ All sanity checks passed!")
          PYTHON
