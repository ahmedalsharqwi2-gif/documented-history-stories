name: Motion Alignment Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/motion-alignment-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: revised-motion-episode
          path: alignment-review
          run-id: 39470222401
          repository: ahmedalsharqwi2-gif/documented-history-stories
          github-token: ${{ github.token }}
      - name: Inspect actual speech recognition difference
        run: cat alignment-review/*alignment-failed.json
