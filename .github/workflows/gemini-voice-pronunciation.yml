name: Gemini Egyptian Pronunciation Trial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gemini-voice-pronunciation.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper==1.2.1
      - name: Generate two genuine Gemini Egyptian narrator samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python audio_repair/gemini_voices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: actual-gemini-egyptian-voices, path: gemini-voice-tests/, retention-days: 30}
      - name: Save real Gemini voice results or explicit provider errors
        env:
          RESULT_BRANCH: codex/gemini-voice-tests-${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="gemini-voices/$RUN_NUMBER"
          mkdir -p "$target"
          cp gemini-voice-tests/* "$target/"
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save genuine Gemini Egyptian narration trials without a substitute provider"
          git push origin "$RESULT_BRANCH"
