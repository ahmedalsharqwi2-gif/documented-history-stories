{
  "name": "Check alternate public historical references without generation",
  "on": {
    "push": {
      "branches": [
        "codex/daily-professional-factory"
      ],
      "paths": [
        ".github/workflows/professional-history-source-review.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "source_review": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4"
        },
        {
          "run": "python -m professional_motion.check_history_alternatives"
        },
        {
          "name": "Preserve bounded source excerpts for genuine editorial review",
          "if": "always()",
          "run": "python -m professional_motion.review_evidence",
          "env": {
            "REVIEW_STAGE": "source-support-only",
            "REVIEW_ONLY": "true"
          }
        }
      ]
    }
  }
}
