name: Delete confirmed YouTube videos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-confirmed-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install YouTube client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Delete only the user-confirmed video IDs
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
        run: |
          python - <<'PY'
          import os
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          ids = [
              "4R8Fiz1HX3s",
              "OGj1pdeTfeg",
              "Bx9sEiTpmKg",
              "vjqWcZvbDEE",
              "dOpPPpnmXmM",
              "SDqbI4fUA5M",
              "VlhmCR8C_sI",
              "jfvnOrDsavQ",
              "SwTl_JeiWoQ",
          ]
          client_id = os.environ.get("YT_CLIENT_ID", "").strip()
          client_secret = os.environ.get("YT_CLIENT_SECRET", "").strip()
          refresh_tokens = [
              value.strip()
              for value in (os.environ.get("YT_REFRESH_TOKEN", ""), os.environ.get("YT_REFRESH_TOKEN_FALLBACK", ""))
              if value.strip()
          ]
          missing = [name for name, value in (("YT_CLIENT_ID", client_id), ("YT_CLIENT_SECRET", client_secret), ("YT_REFRESH_TOKEN", refresh_tokens)) if not value]
          if missing:
              raise SystemExit("Missing YouTube credentials: " + ", ".join(missing))
          credentials = None
          refresh_errors = []
          for refresh_token in refresh_tokens:
              candidate = Credentials(
                  token=None,
                  refresh_token=refresh_token,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=client_id,
                  client_secret=client_secret,
                  scopes=["https://www.googleapis.com/auth/youtube.force-ssl"],
              )
              try:
                  candidate.refresh(Request())
                  credentials = candidate
                  break
              except Exception as exc:
                  refresh_errors.append(str(exc))
          if credentials is None:
              raise SystemExit("Could not refresh any YouTube token: " + " | ".join(refresh_errors)[-1000:])
          youtube = build("youtube", "v3", credentials=credentials)
          failed = []
          for video_id in ids:
              try:
                  youtube.videos().delete(id=video_id).execute()
                  print(f"DELETED https://youtu.be/{video_id}")
              except HttpError as exc:
                  status = getattr(exc.resp, "status", "unknown")
                  if status == 404:
                      print(f"ALREADY_ABSENT https://youtu.be/{video_id}")
                  else:
                      print(f"FAILED {video_id} HTTP {status}: {exc}")
                      failed.append(video_id)
          if failed:
              raise SystemExit("Deletion failed for: " + ", ".join(failed))
          print("CONFIRMED_DELETE_COMPLETE: all nine IDs processed")
          PY
