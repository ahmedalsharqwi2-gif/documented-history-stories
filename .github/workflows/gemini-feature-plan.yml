name: Gemini Original Feature Plan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['motion_feature/gemini_plan.py', 'motion_feature/facts.json', '.github/workflows/gemini-feature-plan.yml']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Request original Egyptian feature script and storyboard from Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python motion_feature/gemini_plan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-feature-plan
          path: feature-work/
          retention-days: 30
          if-no-files-found: warn
      - name: Save actual Gemini response and generation provenance
        if: always()
        env:
          RESULT_BRANCH: codex/gemini-feature-plan-${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="motion-feature-plans/$RUN_NUMBER"
          mkdir -p "$target"
          cp feature-work/* "$target/"
          git rev-parse HEAD > "$target/source-commit.txt"
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save actual Gemini original feature script or explicit provider failure evidence"
          git push origin "$RESULT_BRANCH"
