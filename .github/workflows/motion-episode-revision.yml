name: Motion Episode Revision
on:
  workflow_run:
    workflows: ['Complete Motion Episode']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed source run containing script and accepted voice chunks
        default: '39468830702'
        required: true
  push:
    branches: [main]
    paths: ['.github/workflows/motion-episode-revision.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: motion-episode-revision-fast
  cancel-in-progress: false
jobs:
  revise:
    if: ${{ github.event_name != 'workflow_run' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run || '39468830702' }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video-toolkit/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: motion-script-plan
          path: episode-work
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: motion-voice-*
          path: episode-parts
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Install exact renderer and speech alignment
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==1.26.4' 'faster-whisper==1.2.1'
          npm ci --prefix video-toolkit --no-audit --no-fund
          cd video-toolkit
          npx playwright install --with-deps chromium
      - name: Render revised motion with the identical newly generated voice chunks
        run: python motion_episode/produce.py assemble
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revised-motion-episode
          path: output/
          retention-days: 14
          if-no-files-found: warn
      - name: Save revised playable video and exact evidence
        env:
          RESULT_BRANCH: codex/motion-revision-${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="motion-episodes/$RUN_NUMBER"
          mkdir -p "$target"
          cp output/* "$target/"
          git rev-parse HEAD > "$target/render-source-commit.txt"
          printf '%s\n' "$SOURCE_RUN" > "$target/narration-source-run.txt"
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save reviewed motion layout with narration-synchronized visual beats"
          git push origin "$RESULT_BRANCH"
