name: Motion Runtime Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/motion-runtime-diagnostics.yml']
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop superseded heavy render and inspect its progress log
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base="https://api.github.com/repos/ahmedalsharqwi2-gif/documented-history-stories"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(path,method="GET"):
              return urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,method=method),timeout=60)
          with get("/actions/runs/39470222401/cancel","POST") as r:print("Superseded heavy render cancellation requested:",r.status,flush=True)
          for i in range(30):
              data=json.load(get("/actions/runs/39470222401/jobs"))
              jobs=data["jobs"]
              job=jobs[0]
              print("Heavy render status:",job["status"],job.get("conclusion"),flush=True)
              if job["status"]=="completed":break
              time.sleep(3)
          text=get("/actions/jobs/"+str(job["id"])+"/logs").read().decode("utf8",errors="replace")
          for line in text.splitlines():
              if any(term in line for term in ["Rendering","alignment_part","Traceback","Error:","Process exited","ffmpeg","passed","duration_seconds"]):
                  print(line,flush=True)
          PY
