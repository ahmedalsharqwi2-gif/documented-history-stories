name: Gemini Full Egyptian Narration Test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gemini-full-egyptian-narration.yml']
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: feature-ready-to-render
          path: feature-work
          run-id: '39493924939'
          github-token: ${{ github.token }}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install numpy==1.26.4 faster-whisper==1.2.1
      - name: Generate the complete exact Egyptian story through Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python audio_repair/gemini_long.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: genuine-gemini-full-egyptian-narration, path: gemini-long-narration/, retention-days: 30}
      - name: Preserve the complete real narration and its reading assessment
        env:
          RESULT_BRANCH: codex/gemini-long-narration-${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="gemini-narration/$RUN_NUMBER"
          mkdir -p "$target"
          cp gemini-long-narration/* "$target/"
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save complete actual Gemini Egyptian narration and literal independent transcript assessment"
          git push origin "$RESULT_BRANCH"
