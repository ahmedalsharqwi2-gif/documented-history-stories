{
  "name": "Conservative repository cleanup — recoverable branches and generated caches",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/remotion-cleanup-request.json"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "apply": {
          "description": "Apply only the guarded plan; archive every deleted branch first",
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read",
    "pull-requests": "read"
  },
  "concurrency": {
    "group": "repository-housekeeping-history",
    "cancel-in-progress": false
  },
  "jobs": {
    "cleanup": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 100,
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main",
            "fetch-depth": 1
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install inventory and regression prerequisites",
          "run": "python -m pip install requests beautifulsoup4"
        },
        {
          "name": "Inspect API budget and wait for its advertised reset before cleanup",
          "run": "python - <<'PY'\nimport os,time,json,requests\nr=requests.get('https://api.github.com/rate_limit',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'},timeout=30)\nr.raise_for_status()\ncore=r.json()['resources']['core']\nprint(json.dumps({'github_core_remaining':core['remaining'],'github_core_limit':core['limit'],'reset_epoch':core['reset']}))\nif core['remaining']<650:\n delay=max(0,core['reset']-int(time.time())+10)\n if delay>3700:raise SystemExit('Rate budget reset too distant; no mutations')\n print('Waiting for GitHub core API budget before inventory; no production or social calls',flush=True)\n while delay>0:\n  pause=min(30,delay);time.sleep(pause);delay-=pause\nPY"
        },
        {
          "name": "Verify protected refs, active work and cache-only deletion guards",
          "run": "python -m unittest discover -s remotion_factory/tests -q"
        },
        {
          "name": "Inventory or apply the guarded recovery-backed cleanup",
          "run": "python -m remotion_factory.housekeeping"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "repository-cleanup-history-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "cleanup-output/",
            "retention-days": 90,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
