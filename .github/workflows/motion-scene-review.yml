name: Motion Scene Review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/motion-scene-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video-toolkit/package-lock.json
      - run: |
          npm ci --prefix video-toolkit --no-fund --no-audit
          cd video-toolkit
          npx playwright install --with-deps chromium
      - name: Prepare typography and schematic scene preview props
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          from motion_episode.produce import PREPARED,map_paths
          public=Path("episode-work/public");public.mkdir(parents=True,exist_ok=True)
          shutil.copy2("photo_motion/assets/NotoSansArabic-Bold.ttf",public/"NotoSansArabic-Bold.ttf")
          captions=[]
          for i,s in enumerate(PREPARED):
              text=s["narration"].split()
              for k in range(0,len(text),6):
                  words=[{"text":w,"start":i*8+(k+j)*.32,"end":i*8+(k+j+1)*.32} for j,w in enumerate(text[k:k+6])]
                  captions.append({"start":words[0]["start"],"end":words[-1]["end"],"words":words})
          props={"duration":32,"scenes":[{**s,"start":i*8,"end":(i+1)*8} for i,s in enumerate(PREPARED)],"captions":captions,"mapPaths":map_paths()}
          Path("episode-work/render.json").write_text(json.dumps(props,ensure_ascii=False))
          PY
      - name: Render each real composition scene for visual review
        working-directory: video-toolkit
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {bundle} from '@remotion/bundler';
          import {selectComposition,renderStill} from '@remotion/renderer';
          import {chromium} from 'playwright';
          const props=JSON.parse(await fs.readFile('../episode-work/render.json','utf8'));
          const serveUrl=await bundle({entryPoint:path.resolve('src/motion-episode.tsx'),publicDir:path.resolve('../episode-work/public')});
          const options={serveUrl,id:'MotionEpisode',inputProps:props,browserExecutable:chromium.executablePath(),chromiumOptions:{gl:'swangle'}};
          const composition=await selectComposition(options);
          await fs.mkdir('../scene-review',{recursive:true});
          for(let i=0;i<4;i++)await renderStill({...options,composition,frame:i*240+99,imageFormat:'jpeg',jpegQuality:80,output:path.resolve('../scene-review/scene-'+i+'.jpg')});
          await fs.writeFile('../scene-review/README.md','Still-frame visual review only. Word timing in these frames is synthetic; the episode uses actual narration alignment.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: motion-scene-review
          path: scene-review/
      - name: Save frames for inspection
        env:
          RESULT_BRANCH: codex/motion-scene-review-${{ github.run_id }}
        run: |
          git switch -c "$RESULT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene-review
          git commit -m "Save four rendered motion scene frames for visual review"
          git push origin "$RESULT_BRANCH"
