name: Test Documented History Story and Arabic Audio

on:
  workflow_dispatch:
    inputs:
      voice_profile:
        description: "اختر صوت الراوي لاختبار الصوت فقط"
        required: true
        type: choice
        default: mohamed_elbed
        options:
          - mohamed_elbed
          - rafik_sa
          - egyptian_female
          - hossam
          - hossam_uploaded
          - marwan
          - nassim
          - ahmed_z

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install generation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate and resolve AI model policy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_POLICY_FILE: config/model_policy.json
        run: python scripts/model_preflight.py

      - name: Generate first historical story with Gemini
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_THINKING_BUDGET: "0"
          TARGET_WORDS: "300"
          ACCEPTABLE_MIN_WORDS: "0"
          MAX_FULL_ATTEMPTS: "1"
        run: python scripts/generate_script.py

      - name: Generate test narration without publishing
        env:
          TTS_ENGINE: "silma"
          SILMA_REFERENCE_PROFILE: ${{ github.event.inputs.voice_profile || 'mohamed_elbed' }}
          SILMA_VOICE_PROFILES_FILE: "assets/voices/voice_profiles.json"
          SILMA_FALLBACK_TO_EDGE: "false"
          SILMA_GUARD_ENABLED: "true"
          SILMA_GUARD_MIN_MATCH_WORDS: "4"
          EDGE_TTS_VOICE: "ar-EG-ShakirNeural"
          EDGE_TTS_VOICES: "ar-EG-ShakirNeural,ar-SA-HamedNeural"
          EDGE_TTS_RETRIES: "2"
          WHISPER_MODEL: "tiny"
        run: python scripts/generate_voice.py

      - name: Upload story and audio test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: historical-story-audio-test-${{ github.run_id }}
          path: |
            state/current_episode.json
            downloaded_clips/narration_voice.mp3
            downloaded_clips/narration.mp3
            downloaded_clips/narration.ass
          if-no-files-found: error
          retention-days: 14
