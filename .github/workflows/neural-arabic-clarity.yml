name: Arabic Neural Voice Clarity Comparison
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neural-arabic-clarity.yml']
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: feature-ready-to-render
          path: feature-work
          run-id: '39493924939'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: alternative-engine-tests
          path: edge-input
          run-id: '39506881549'
          github-token: ${{ github.token }}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install edge-tts numpy==1.26.4 faster-whisper==1.2.1
          python audio_repair/neural_trial.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: actual-neural-voice-comparison, path: neural-review/, retention-days: 30}
      - name: Preserve fresh neural speech with actual independent transcripts
        env:
          RESULT_BRANCH: codex/neural-clarity-${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="neural-voice-tests/$RUN_NUMBER"
          mkdir -p "$target"
          cp neural-review/* "$target/"
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save genuine new neural Arabic speech and independent reading checks"
          git push origin "$RESULT_BRANCH"
