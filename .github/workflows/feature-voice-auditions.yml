name: VoiceTut Number Auditions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['motion_feature/tts_worker.py', 'motion_feature/audit_voice.py', '.github/workflows/feature-voice-auditions.yml']
permissions:
  contents: read
jobs:
  audition:
    strategy:
      fail-fast: false
      matrix:
        speaker: [Mohammed, Ahmed, Youssef]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: voicetut-44cba00cd3ddb04b5213353e19e960045e332da7-08be0b4ccbac3e13e374e86fbfead4b4cac343e2-cpu-v1
      - run: bash voice_provider/install.sh
      - name: Generate new complete number sentence without internal chunk cuts
        env:
          PYTHONUNBUFFERED: '1'
          SPEAKER: ${{ matrix.speaker }}
        run: timeout 900 "$VOICETUT_PYTHON" motion_feature/tts_worker.py audition --speaker "$SPEAKER"
      - name: Independently transcribe the actual generated speech
        env:
          SPEAKER: ${{ matrix.speaker }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper==1.2.1
          python motion_feature/audit_voice.py "voice-auditions/$SPEAKER/sample.wav"
          ffmpeg -y -i "voice-auditions/$SPEAKER/sample.wav" -codec:a libmp3lame -q:a 2 "voice-auditions/$SPEAKER/sample.mp3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: number-audition-${{ matrix.speaker }}
          path: voice-auditions/
          retention-days: 30
  publish:
    needs: audition
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: number-audition-*
          merge-multiple: true
          path: audition-output
      - name: Preserve actual voice comparisons
        env:
          RESULT_BRANCH: codex/feature-voices-${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          target="feature-voice-tests/$RUN_NUMBER"
          mkdir -p "$target"
          cp -r audition-output/* "$target/"
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Save newly synthesized VoiceTut number auditions and independent transcripts"
          git push origin "$RESULT_BRANCH"
