name: Abu Simbel photoreal cinematic proof (no publishing)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/abu_simbel_photo_proof.py'
      - '.github/workflows/abu-simbel-photo-proof.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free video tools
        run: |
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless arabic-reshaper python-bidi
          command -v ffmpeg
      - name: Render photographic documentary scene
        run: python scripts/abu_simbel_photo_proof.py
      - name: Check actual decoded frames
        run: |
          ffprobe -v error -show_entries format=duration -of default=nw=1 abu-simbel-cinematic-proof.mp4
          ffmpeg -v error -i abu-simbel-cinematic-proof.mp4 -f null -
          test -s abu-simbel-proof-preview.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abu-simbel-documentary-proof-${{ github.run_id }}
          path: |
            abu-simbel-cinematic-proof.mp4
            abu-simbel-proof-preview.jpg
          retention-days: 14
