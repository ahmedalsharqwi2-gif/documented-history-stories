name: NEW full Abu Simbel episode - private review
on:
  push:
    paths:
      - 'scripts/produce_new_abu_simbel.py'
      - '.github/workflows/new-full-abu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audiovisual tools
        run: |
          python -m pip install opencv-python-headless pillow numpy imageio-ffmpeg
          mkdir -p "$HOME/.local/bin"
          python - <<'PY'
          import imageio_ffmpeg,os,pathlib
          src=imageio_ffmpeg.get_ffmpeg_exe()
          target=pathlib.Path.home()/'.local/bin/ffmpeg'
          target.symlink_to(src)
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(target.parent)+'\n')
          print('FFmpeg installed via Python:',src)
          PY
      - name: Generate NEW narration and entire movie
        run: PYTHONPATH=. python scripts/produce_new_abu_simbel.py
      - name: Upload complete episode without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEW-abu-simbel-full-${{ github.run_id }}
          path: output/new_abu_simbel/
          retention-days: 14
