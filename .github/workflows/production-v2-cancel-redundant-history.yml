{
  "name": "Cancel only redundant queued history generation",
  "on": {
    "push": {
      "branches": [
        "codex/rebuild-production-v2"
      ],
      "paths": [
        ".github/history-queued-generation-cancel.json"
      ]
    }
  },
  "permissions": {
    "actions": "write",
    "contents": "read"
  },
  "jobs": {
    "cancel": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}",
        "GITHUB_REPOSITORY": "${{ github.repository }}"
      },
      "steps": [
        {
          "name": "Cancel the exact pending fresh-generation run; keep retained-audio run alive",
          "run": "python - <<'PY'\nimport json,os,urllib.request\nrepo=os.environ['GITHUB_REPOSITORY']\nif repo!='ahmedalsharqwi2-gif/documented-history-stories':raise ValueError('Wrong repository')\nbase='https://api.github.com/repos/'+repo+'/actions/runs/41352845105'\nheaders={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}\nwith urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=30) as response:run=json.load(response)\nif run.get('head_sha')!='1317c20ceccd98e6844fe60dbab61dd6a327548f':raise ValueError('Queued source changed; do not cancel another run')\nif run.get('status') in ('queued','pending','waiting','requested'):\n with urllib.request.urlopen(urllib.request.Request(base+'/cancel',data=b'',headers=headers,method='POST'),timeout=30) as response:print(json.dumps({'target_run':41352845105,'cancellation_http':response.status,'retained_audio_run_41350831647_untouched':True}))\nelse:print(json.dumps({'target_run':41352845105,'observed_status':run.get('status'),'cancelled_by_this_job':False}))\nPY"
        }
      ]
    }
  }
}
