name: Feature Number Word Review
# Keep timestamp and language control tokens; suppress only numeric text tokens.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/feature-number-word-review.yml']
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: feature-voice-*
          merge-multiple: true
          run-id: '39493924939'
          github-token: ${{ github.token }}
          path: number-review-input
      - run: python -m pip install faster-whisper==1.2.1
      - name: Check the actual spoken number words without numeric normalization
        run: python motion_feature/check_number_words.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: actual-number-word-review, path: number-word-review/}
      - name: Save independent number-word evidence
        env:
          RESULT_BRANCH: codex/number-word-review-${{ github.run_id }}
        run: |
          git fetch origin main
          git switch --discard-changes -c "$RESULT_BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add number-word-review
          git commit -m "Save unprompted number-word transcripts from two ASR models"
          git push origin "$RESULT_BRANCH"
